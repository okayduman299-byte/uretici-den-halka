<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Siparişlerim | Üreticiden Halka</title><link rel="stylesheet" href="site-polish.css"><style>body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f8f4;color:#17211b}.container{width:min(900px,calc(100% - 30px));margin:auto}header{background:#fff;border-bottom:1px solid #dfe7df}.nav{min-height:74px;display:flex;align-items:center}.logo img{width:190px;max-height:55px;object-fit:contain}.back{margin-left:auto;color:#166534;font-weight:900;text-decoration:none;font-size:12px}.page{padding:35px 0 65px}.head{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:20px}.head h1{margin:0 0 5px;font-size:32px}.muted{color:#718078;font-size:12px;line-height:1.6}.btn{border:0;border-radius:10px;padding:11px 14px;background:#166534;color:#fff;font-weight:900;cursor:pointer}.orders{display:grid;gap:12px}.order{background:#fff;border:1px solid #dfe7df;border-radius:17px;padding:17px}.row{display:flex;justify-content:space-between;gap:15px;align-items:center}.no{font-size:16px;font-weight:950}.date{color:#718078;font-size:10px;margin-top:4px}.badge{background:#edf5ee;color:#166534;border-radius:999px;padding:7px 9px;font-size:9px;font-weight:900}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px;padding-top:13px;border-top:1px solid #edf1ed}.meta span{display:block;color:#718078;font-size:9px}.meta b{display:block;font-size:12px;margin-top:4px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.action{display:inline-flex;padding:9px 11px;border-radius:9px;background:#edf3ed;color:#166534;text-decoration:none;font-size:10px;font-weight:900}.empty{background:#fff;border:1px dashed #cfd8d0;border-radius:17px;text-align:center;padding:45px 20px;color:#718078}.empty a{display:inline-block;margin-top:14px;background:#166534;color:#fff;text-decoration:none;padding:11px 15px;border-radius:10px;font-size:11px;font-weight:900}.err{background:#fff0f0;color:#991b1b;border-radius:10px;padding:12px;font-size:11px}@media(max-width:600px){.head{display:block}.head .btn{margin-top:12px}.meta{grid-template-columns:1fr 1fr}.row{align-items:flex-start}.badge{white-space:nowrap}}</style></head><body><header><div class="container nav"><a class="logo" href="index.html"><img src="logo (1).png" alt="Üreticiden Halka"></a><a class="back" href="index.html">← Alışverişe dön</a></div></header><main class="container page"><div class="head"><div><h1>Siparişlerim</h1><div class="muted">Hesabına bağlı siparişlerini güvenli şekilde görüntüleyebilirsin.</div></div><button class="btn" id="logout">Çıkış Yap</button></div><div id="content"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient('https://bzudwfyxgbkzvfjhhywy.supabase.co','sb_publishable_a_gZqrURzUqY14KGJXbxxw_AgBbOxRu'),$=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]))}function money(v){return Number(v||0).toLocaleString('tr-TR',{minimumFractionDigits:2})+' ₺'}function render(rows){if(!rows.length){$('content').innerHTML='<div class="empty"><div style="font-size:42px">📦</div><b>Henüz siparişin yok.</b><div>Üreticilerden ürünleri keşfetmeye başlayabilirsin.</div><a href="index.html">Alışverişe Başla →</a></div>';return}$('content').innerHTML='<div class="orders">'+rows.map(o=>'<article class="order"><div class="row"><div><div class="no">'+esc(o.siparis_no)+'</div><div class="date">'+new Date(o.created_at).toLocaleString('tr-TR')+'</div></div><span class="badge">'+esc(o.durum||'Yeni')+'</span></div><div class="meta"><div><span>Toplam</span><b>'+money(o.toplam)+'</b></div><div><span>Ödeme</span><b>'+esc(o.odeme_yontemi==='havale'?'Havale / EFT':o.odeme_yontemi==='kart'?'Online Kart':'Kapıda Ödeme')+'</b></div><div><span>Ödeme durumu</span><b>'+esc(o.odeme_durumu||'Bekliyor')+'</b></div></div><div class="actions"><a class="action" href="siparis-takip.html?no='+encodeURIComponent(o.siparis_no)+'">Takip Et</a>'+(o.odeme_yontemi==='havale'?'<a class="action" href="havale-bildirim.html?no='+encodeURIComponent(o.siparis_no)+'">Havale Bildirimi</a>':'')+'</div></article>').join('')+'</div>'}async function init(){const {data:{session}}=await db.auth.getSession();if(!session){location.href='musteri-giris.html?next=siparislerim.html';return}const r=await db.rpc('get_my_orders');if(r.error){$('content').innerHTML='<div class="err">Siparişler yüklenemedi: '+esc(r.error.message)+'</div>';return}render(r.data||[])}$('logout').onclick=async()=>{await db.auth.signOut();location.href='index.html'};init();</script></body></html>
