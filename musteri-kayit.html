<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Müşteri Kaydı | Üreticiden Halka</title><style>body{margin:0;font-family:Inter,Arial,sans-serif;background:linear-gradient(135deg,#eaf5e8,#f8fbf7);color:#17211b;min-height:100vh;display:grid;place-items:center}.box{width:min(460px,calc(100% - 28px));background:#fff;border:1px solid #dfe7df;border-radius:22px;padding:28px;box-shadow:0 20px 60px rgba(24,53,31,.1)}.logo{text-align:center}.logo img{width:190px}.back{display:block;text-align:center;color:#166534;font-size:11px;font-weight:900;margin:12px 0 22px}.title{text-align:center}.title h1{margin:0 0 7px;font-size:27px}.title p{color:#718078;font-size:12px;line-height:1.6;margin:0 0 20px}.field{margin:11px 0}.field label{display:block;font-size:11px;font-weight:900;margin-bottom:6px}.field input{width:100%;height:45px;border:1px solid #d8e1d8;border-radius:10px;padding:0 12px;font:inherit;outline:0}.btn{width:100%;height:46px;border:0;border-radius:11px;background:#166534;color:#fff;font-weight:950;cursor:pointer;margin-top:8px}.btn:disabled{opacity:.6}.secondary{display:block;text-align:center;margin-top:14px;color:#166534;font-size:11px;font-weight:900}.msg{display:none;margin-top:12px;padding:11px;border-radius:10px;font-size:11px;line-height:1.5}.err{background:#fff0f0;color:#991b1b}.ok{background:#edf8ee;color:#166534}.note{text-align:center;color:#718078;font-size:10px;line-height:1.6;margin-top:20px}</style></head><body><main class="box"><div class="logo"><img src="logo (1).png" alt="Üreticiden Halka"></div><a class="back" href="index.html">← Alışverişe dön</a><div class="title"><h1>Müşteri Hesabı Oluştur</h1><p>Hesabını oluştur, siparişlerini daha güvenli takip et.</p></div><form id="form"><div class="field"><label>E-posta</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label>Şifre</label><input id="password" type="password" minlength="6" autocomplete="new-password" required></div><button class="btn" id="btn">Hesap Oluştur</button></form><div id="err" class="msg err"></div><div id="ok" class="msg ok"></div><a class="secondary" href="musteri-giris.html">Zaten hesabın var mı? Giriş yap</a><div class="note">E-posta doğrulaması Supabase Auth ayarlarına göre istenebilir.</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient('https://bzudwfyxgbkzvfjhhywy.supabase.co','sb_publishable_a_gZqrURzUqY14KGJXbxxw_AgBbOxRu');const form=document.getElementById('form'),btn=document.getElementById('btn'),err=document.getElementById('err'),ok=document.getElementById('ok');form.addEventListener('submit',async e=>{e.preventDefault();err.style.display='none';ok.style.display='none';btn.disabled=true;btn.textContent='Hesap oluşturuluyor...';const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const {data,error}=await db.auth.signUp({email,password});if(error){err.textContent='Kayıt yapılamadı: '+error.message;err.style.display='block';btn.disabled=false;btn.textContent='Hesap Oluştur';return}ok.textContent=data.session?'Hesap oluşturuldu. Giriş yapıldı.':'Hesap oluşturuldu. E-posta doğrulaman gerekiyorsa gelen kutunu kontrol et.';ok.style.display='block';setTimeout(()=>location.href=data.session?'sepet.html':'musteri-giris.html',900)});</script></body></html>
