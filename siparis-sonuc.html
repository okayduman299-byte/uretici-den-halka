<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Siparişiniz Alındı | Üreticiden Halka</title>
<style>
:root{--g:#14532d;--g2:#166534;--ink:#17211b;--muted:#718078;--soft:#f5f8f4;--line:#e1e8e1}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--soft);color:var(--ink)}
.container{width:min(760px,calc(100% - 30px));margin:auto}
header{background:#fff;border-bottom:1px solid var(--line)}.nav{min-height:74px;display:flex;align-items:center}.logo img{width:190px;max-height:55px;object-fit:contain;display:block}
.page{padding:50px 0 70px}.card{background:#fff;border:1px solid var(--line);border-radius:25px;padding:34px;box-shadow:0 15px 45px #18351f0c;text-align:center}
.icon{width:72px;height:72px;border-radius:50%;background:#e6f5e9;color:var(--g2);display:grid;place-items:center;font-size:34px;font-weight:950;margin:0 auto 20px}
h1{margin:0 0 9px;font-size:32px;letter-spacing:-.8px}.sub{color:var(--muted);font-size:13px;line-height:1.6}
.number{margin:24px auto;padding:18px;border:1px dashed #9fbaa5;border-radius:16px;background:#f7fbf6;max-width:430px}.number small{display:block;color:var(--muted);font-size:10px;font-weight:800;margin-bottom:7px}.number b{font-size:25px;color:var(--g2);letter-spacing:.5px}
.payment{margin:22px auto 0;max-width:520px;text-align:left;border:1px solid var(--line);border-radius:17px;padding:18px;background:#fbfdfb}.row{display:flex;justify-content:space-between;gap:15px;padding:8px 0;font-size:13px}.row span{color:var(--muted)}.row b{font-weight:900}.status{color:#9a6b00!important}.eft{display:none;margin-top:14px;padding:15px;border-radius:13px;background:#fff8e8;border:1px solid #f1dfad;color:#6d5514;font-size:11px;line-height:1.6}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:25px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border-radius:11px;font-size:12px;font-weight:950;text-decoration:none}.primary{background:var(--g2);color:#fff}.secondary{background:#edf3ed;color:var(--g2)}.copy{border:0;cursor:pointer}
.note{margin-top:20px;color:var(--muted);font-size:10px;line-height:1.6}.err{color:#991b1b;background:#fff0f0;padding:14px;border-radius:12px}
@media(max-width:520px){.card{padding:24px 16px}h1{font-size:28px}.number b{font-size:21px}.row{font-size:12px}}
</style>
</head>
<body>
<header><div class="container nav"><a class="logo" href="index.html"><img src="logo (1).png" alt="Üreticiden Halka"></a></div></header>
<main class="container page"><div class="card" id="app"><div class="icon">✓</div><h1>Siparişiniz alındı</h1><div class="sub">Siparişiniz başarıyla oluşturuldu. Sipariş numaranızı saklayın.</div><div class="number"><small>SİPARİŞ NUMARASI</small><b id="orderNo">Yükleniyor...</b></div><div id="details"></div><div class="actions" id="actions"></div><div class="note">Sipariş durumunuzu takip etmek için sipariş numaranızı kullanabilirsiniz.</div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=window.supabase.createClient("https://bzudwfyxgbkzvfjhhywy.supabase.co","sb_publishable_a_gZqrURzUqY14KGJXbxxw_AgBbOxRu");
const $=id=>document.getElementById(id);
const no=new URLSearchParams(location.search).get("no");
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
async function load(){
 if(!no){$("app").innerHTML='<div class="err">Sipariş numarası bulunamadı.</div>';return}
 $("orderNo").textContent=no;
 const r=await db.from("siparisler").select("siparis_no,odeme_yontemi,odeme_durumu,toplam").eq("siparis_no",no).maybeSingle();
 if(r.error||!r.data){
  $("details").innerHTML='<div class="payment"><div class="row"><span>Ödeme yöntemi</span><b>—</b></div><div class="row"><span>Ödeme durumu</span><b class="status">Bekliyor</b></div></div>';
  actions(false);return;
 }
 const o=r.data, eft=o.odeme_yontemi==="havale";
 $("details").innerHTML='<div class="payment"><div class="row"><span>Ödeme yöntemi</span><b>'+ (eft?"Havale / EFT":o.odeme_yontemi==="kart"?"Online Kart":"Kapıda Ödeme") +'</b></div><div class="row"><span>Ödeme durumu</span><b class="status">'+esc(o.odeme_durumu||"Bekliyor")+'</b></div><div class="row"><span>Sipariş toplamı</span><b>'+Number(o.toplam||0).toLocaleString("tr-TR",{minimumFractionDigits:2})+' ₺</b></div>'+ (eft?'<div class="eft" style="display:block"><b>Havale / EFT seçtiniz.</b><br>Ödeme yaptıktan sonra aşağıdaki bağlantıdan ödemenizi bildirebilirsiniz.</div>':"") +'</div>';
 actions(eft);
}
function actions(eft){
 $("actions").innerHTML=(eft?'<a class="btn primary" href="havale-bildirim.html?no='+encodeURIComponent(no)+'">Havale / EFT Bildirimi</a>':"")+'<a class="btn secondary" href="siparis-takip.html?no='+encodeURIComponent(no)+'">Siparişimi Takip Et</a><button class="btn secondary copy" onclick="copyNo()">Sipariş No Kopyala</button><a class="btn secondary" href="index.html">Alışverişe Devam Et</a>';
}
async function copyNo(){try{await navigator.clipboard.writeText(no);alert("Sipariş numarası kopyalandı: "+no)}catch{alert(no)}}
load();
</script>
</body>
</html>
