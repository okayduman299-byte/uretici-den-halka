<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Havale Bildirimi | Üreticiden Halka</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f8f4;color:#17211b}.wrap{width:min(620px,calc(100% - 28px));margin:50px auto}.card{background:#fff;border:1px solid #e0e7e0;border-radius:20px;padding:25px}.logo{font-size:22px;font-weight:900;color:#166534;margin-bottom:20px}.logo span{color:#17211b}h1{margin:0 0 8px}.muted{color:#718078;font-size:13px;line-height:1.6}.field{margin-top:13px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}.field input,.field textarea{width:100%;padding:12px;border:1px solid #d8e1d8;border-radius:10px;font:inherit}.field textarea{min-height:90px}.btn{margin-top:17px;width:100%;height:47px;border:0;border-radius:10px;background:#166534;color:#fff;font-weight:900;cursor:pointer}.msg{display:none;margin-top:13px;padding:12px;border-radius:10px;font-size:13px}.ok{background:#e8f6e9;color:#166534}.err{background:#fff0f0;color:#991b1b}.bank{margin-top:18px;padding:15px;border-radius:12px;background:#fff8e8;border:1px solid #f1dfad;color:#6d5514;font-size:13px;line-height:1.6}
</style></head><body><main class="wrap"><div class="logo">Üreticiden <span>Halka</span></div><section class="card"><h1>Havale / EFT Bildirimi</h1><p class="muted">Havale veya EFT yaptıysanız aşağıdaki formdan bildiriminizi gönderin. Banka hesap bilgileriniz sipariş/ödeme sayfasında ayrıca paylaşılmalıdır.</p>
<div class="bank" id="bankBox">Banka bilgileri yükleniyor...</div>
<form id="form"><div class="field"><label>Sipariş numarası *</label><input id="orderNo" required placeholder="Örn. UDH-2026-0001"></div><div class="field"><label>Gönderen adı soyadı *</label><input id="sender" required></div><div class="field"><label>Gönderilen tutar (₺) *</label><input id="amount" type="number" min="0" step="0.01" required></div><div class="field"><label>Açıklama</label><textarea id="note" placeholder="Dekont / işlem bilgisi"></textarea></div><button class="btn" id="btn">Ödeme Bildirimi Gönder</button><div id="msg" class="msg"></div></form></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient("https://bzudwfyxgbkzvfjhhywy.supabase.co","sb_publishable_a_gZqrURzUqY14KGJXbxxw_AgBbOxRu");
const orderFromUrl=new URLSearchParams(location.search).get("no");if(orderFromUrl)document.getElementById("orderNo").value=orderFromUrl;
async function loadBank(){const r=await db.from("odeme_ayarlari").select("banka_adi,hesap_sahibi,iban,aciklama").eq("aktif",true).limit(1).maybeSingle();const b=document.getElementById("bankBox");if(r.error){b.textContent="Banka bilgileri alınamadı.";return}if(!r.data){b.innerHTML="<b>Havale bilgileri henüz tanımlanmamış.</b>";return}b.innerHTML="<b>Havale / EFT bilgileri</b><br>Banka: "+(r.data.banka_adi||"-")+"<br>Hesap sahibi: "+(r.data.hesap_sahibi||"-")+"<br>IBAN: "+(r.data.iban||"-")+(r.data.aciklama?"<br>"+r.data.aciklama:"")}
loadBank();
const $=id=>document.getElementById(id);function show(t,ok){$("msg").textContent=t;$("msg").className="msg "+(ok?"ok":"err");$("msg").style.display="block"}
$("form").onsubmit=async e=>{e.preventDefault();$("msg").style.display="none";$("btn").disabled=true;
try{const no=$("orderNo").value.trim();const q=await db.from("siparisler").select("id,toplam,odeme_yontemi").eq("siparis_no",no).maybeSingle();if(q.error)throw q.error;if(!q.data)throw new Error("Sipariş bulunamadı.");
if(q.data.odeme_yontemi!=="havale")throw new Error("Bu sipariş havale/EFT olarak seçilmemiş.");
const note=`Havale bildirimi | Gönderen: ${$("sender").value.trim()} | Tutar: ${Number($("amount").value).toFixed(2)} TL | ${$("note").value.trim()}`;
const r=await db.from("siparisler").update({odeme_notu:note}).eq("id",q.data.id);if(r.error)throw r.error;show("Ödeme bildiriminiz alındı. Yönetici kontrolünden sonra ödeme durumu güncellenecektir.",true);$("form").reset()}catch(x){show(x.message||"Bildirim gönderilemedi.",false)}finally{$("btn").disabled=false}};
</script></body></html>
