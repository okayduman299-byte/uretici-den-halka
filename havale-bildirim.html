<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Havale Bildirimi | Üreticiden Halka</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f8f4;color:#17211b}
.wrap{width:min(620px,calc(100% - 28px));margin:50px auto}
.card{background:#fff;border:1px solid #e0e7e0;border-radius:20px;padding:25px}
.logo{font-size:22px;font-weight:900;color:#166534;margin-bottom:20px}.logo span{color:#17211b}
h1{margin:0 0 8px}.muted{color:#718078;font-size:13px;line-height:1.6}
.field{margin-top:13px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}
.field input,.field textarea{width:100%;padding:12px;border:1px solid #d8e1d8;border-radius:10px;font:inherit}
.field textarea{min-height:90px}
.btn{margin-top:17px;width:100%;height:47px;border:0;border-radius:10px;background:#166534;color:#fff;font-weight:900;cursor:pointer}
.btn:disabled{opacity:.6;cursor:not-allowed}
.msg{display:none;margin-top:13px;padding:12px;border-radius:10px;font-size:13px}
.ok{background:#e8f6e9;color:#166534}.err{background:#fff0f0;color:#991b1b}
.bank{margin-top:18px;padding:15px;border-radius:12px;background:#fff8e8;border:1px solid #f1dfad;color:#6d5514;font-size:13px;line-height:1.7}
.back{display:inline-block;margin-top:18px;color:#166534;font-weight:800;text-decoration:none}
</style>
</head>
<body>
<main class="wrap">
  <div class="logo">Üreticiden <span>Halka</span></div>
  <section class="card">
    <h1>Havale / EFT Bildirimi</h1>
    <p class="muted">Havale veya EFT yaptıysanız aşağıdaki formdan bildiriminizi gönderin.</p>

    <div class="bank" id="bankBox">Banka bilgileri yükleniyor...</div>

    <form id="form">
      <div class="field">
        <label>Sipariş numarası *</label>
        <input id="orderNo" required placeholder="Örn. UH-20260818-00015">
      </div>
      <div class="field">
        <label>Gönderen adı soyadı *</label>
        <input id="sender" required>
      </div>
      <div class="field">
        <label>Gönderilen tutar (₺) *</label>
        <input id="amount" type="number" min="0.01" step="0.01" required>
      </div>
      <div class="field">
        <label>Açıklama</label>
        <textarea id="note" placeholder="Dekont / işlem bilgisi"></textarea>
      </div>
      <button class="btn" id="btn" type="submit">Ödeme Bildirimi Gönder</button>
      <div id="msg" class="msg"></div>
    </form>

    <a class="back" id="back" href="index.html">← Alışverişe dön</a>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=window.supabase.createClient(
  "https://bzudwfyxgbkzvfjhhywy.supabase.co",
  "sb_publishable_a_gZqrURzUqY14KGJXbxxw_AgBbOxRu"
);

const $=id=>document.getElementById(id);
const orderFromUrl=new URLSearchParams(location.search).get("no")||"";

if(orderFromUrl){
  $("orderNo").value=orderFromUrl;
  $("back").href="siparis-sonuc.html?no="+encodeURIComponent(orderFromUrl);
}

function esc(v){
  return String(v??"").replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}

function show(text,ok){
  $("msg").textContent=text;
  $("msg").className="msg "+(ok?"ok":"err");
  $("msg").style.display="block";
}

async function loadBank(){
  const r=await db.from("odeme_ayarlari")
    .select("banka_adi,hesap_sahibi,iban,aciklama")
    .eq("aktif",true)
    .limit(1)
    .maybeSingle();

  if(r.error){
    $("bankBox").textContent="Banka bilgileri alınamadı.";
    return;
  }

  if(!r.data){
    $("bankBox").innerHTML="<b>Havale bilgileri henüz tanımlanmamış.</b>";
    return;
  }

  $("bankBox").innerHTML=
    "<b>Havale / EFT bilgileri</b><br>"+
    "Banka: "+esc(r.data.banka_adi||"-")+"<br>"+
    "Hesap sahibi: "+esc(r.data.hesap_sahibi||"-")+"<br>"+
    "IBAN: "+esc(r.data.iban||"-")+
    (r.data.aciklama?"<br>"+esc(r.data.aciklama):"");
}

$("form").addEventListener("submit",async e=>{
  e.preventDefault();
  $("msg").style.display="none";
  $("btn").disabled=true;
  $("btn").textContent="Gönderiliyor...";

  try{
    const no=$("orderNo").value.trim();
    const sender=$("sender").value.trim();
    const amount=Number($("amount").value);
    const extra=$("note").value.trim();

    if(!no||!sender||!amount) throw new Error("Zorunlu alanları doldurun.");

    const q=await db.from("siparisler")
      .select("id,siparis_no,toplam,odeme_yontemi")
      .eq("siparis_no",no)
      .maybeSingle();

    if(q.error) throw q.error;
    if(!q.data) throw new Error("Sipariş bulunamadı.");
    if(q.data.odeme_yontemi!=="havale")
      throw new Error("Bu sipariş Havale / EFT olarak oluşturulmamış.");

    const note="Havale bildirimi | Gönderen: "+sender+
      " | Tutar: "+amount.toFixed(2)+" TL"+
      (extra?" | "+extra:"");

    const r=await db.from("siparisler")
      .update({odeme_notu:note})
      .eq("id",q.data.id);

    if(r.error) throw r.error;

    show("Ödeme bildiriminiz alındı. Yönetici kontrolünden sonra ödeme durumu güncellenecektir.",true);

    setTimeout(()=>{
      location.href="siparis-sonuc.html?no="+encodeURIComponent(no)+"&reported=1";
    },900);

  }catch(err){
    show(err.message||"Bildirim gönderilemedi.",false);
    $("btn").disabled=false;
    $("btn").textContent="Ödeme Bildirimi Gönder";
  }
});

loadBank();
</script>
</body>
</html>
