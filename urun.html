<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ürün | Üreticiden Halka</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7faf7;color:#17211b}a{text-decoration:none;color:inherit}
.container{width:min(1100px,calc(100% - 28px));margin:auto}header{background:#fff;border-bottom:1px solid #e4e9e4;position:sticky;top:0;z-index:5}.nav{height:70px;display:flex;align-items:center;gap:15px}.logo{font-weight:900;font-size:20px;color:#166534}.logo span{color:#17211b}.search{flex:1}.search input{width:100%;height:42px;border:1px solid #d9e1d9;border-radius:12px;padding:0 14px}.navbtn{padding:10px 13px;border:1px solid #d9e1d9;background:#fff;border-radius:11px;font-weight:700}
main{padding:32px 0}.crumb{font-size:13px;color:#748078;margin-bottom:18px}.card{background:#fff;border:1px solid #e0e7e0;border-radius:22px;overflow:hidden}.product{display:grid;grid-template-columns:1fr 1fr}.photo{min-height:480px;background:#eef2ec;display:grid;place-items:center;font-size:100px}.photo img{width:100%;height:100%;object-fit:cover}.info{padding:38px}.tag{color:#55705c;font-size:13px}.title{font-size:38px;line-height:1.1;margin:10px 0}.desc{color:#6e7a72;line-height:1.7}.price{font-size:30px;font-weight:900;margin:24px 0}.stock{font-size:13px;color:#55705c}.qty{display:flex;align-items:center;gap:10px;margin:20px 0}.qty button{width:38px;height:38px;border:1px solid #d5ddd5;background:#fff;border-radius:9px;font-size:20px}.qty input{width:55px;text-align:center;height:38px;border:1px solid #d5ddd5;border-radius:9px}.buy{width:100%;height:50px;border:0;border-radius:12px;background:#166534;color:#fff;font-weight:800;font-size:16px;cursor:pointer}.producer{margin-top:20px;padding:18px;background:#f2f7f1;border-radius:15px}.loading{padding:60px;text-align:center;color:#718078}
@media(max-width:700px){.product{grid-template-columns:1fr}.photo{min-height:300px}.info{padding:24px}.title{font-size:30px}}
</style></head><body>
<header><div class="container nav"><a class="logo" href="index.html">Üreticiden <span>Halka</span></a><div class="search"><input placeholder="Ürün ara..." onkeydown="if(event.key==='Enter')location.href='index.html#urunler'"></div><a class="navbtn" href="favoriler.html">♡</a><a class="navbtn" href="sepet.html">🛒 <span id="cartCount">0</span></a></div></header>
<main><div class="container"><div class="crumb"><a href="index.html">Ana sayfa</a> / Ürün</div><div id="app" class="card"><div class="loading">Ürün yükleniyor...</div></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient("https://bzudwfyxgbkzvfjhhywy.supabase.co","sb_publishable_a_gZqrURzUqY14KGJXbxxw_AgBbOxRu");
const id=new URLSearchParams(location.search).get("id"), app=document.getElementById("app");
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function cart(){try{return JSON.parse(localStorage.getItem("uh_cart")||"[]")}catch{return[]}}
function count(){document.getElementById("cartCount").textContent=cart().reduce((n,x)=>n+Number(x.qty||0),0)}
function add(p,q){let c=cart(),x=c.find(a=>Number(a.id)===Number(p.id));if(x){if(x.qty+q>p.stok)return alert("Stok yetersiz.");x.qty+=q}else c.push({id:p.id,name:p.urun_adi,category:p.kategori||"",price:Number(p.fiyat),stock:Number(p.stok),image:p.gorsel_url||"",producer_id:p.uretici_id,qty:q});localStorage.setItem("uh_cart",JSON.stringify(c));count();alert("Ürün sepete eklendi ✓")}
async function load(){
 if(!id){app.innerHTML='<div class="loading">Ürün bulunamadı.</div>';return}
 const r=await db.from("urunler").select("id,urun_adi,aciklama,kategori,fiyat,stok,gorsel_url,uretici_id").eq("id",id).eq("aktif",true).single();
 if(r.error||!r.data){app.innerHTML='<div class="loading">Ürün bulunamadı veya yayından kaldırılmış.</div>';return}
 const p=r.data;let producer=null;
 if(p.uretici_id){const q=await db.from("ureticiler").select("firma_adi,il,ilce,kategori").eq("id",p.uretici_id).maybeSingle();producer=q.data}
 app.innerHTML=`<div class="product"><div class="photo">${p.gorsel_url?`<img src="${esc(p.gorsel_url)}" alt="${esc(p.urun_adi)}">`:"🧺"}</div><div class="info"><div class="tag">${esc(p.kategori||"Ürün")}</div><h1 class="title">${esc(p.urun_adi)}</h1><p class="desc">${esc(p.aciklama||"Üreticiden doğrudan temin edilen ürün.")}</p><div class="price">${Number(p.fiyat||0).toLocaleString("tr-TR",{minimumFractionDigits:2})} ₺</div><div class="stock">${p.stok>0?"✓ Stokta "+p.stok+" adet":"Stokta yok"}</div><div class="qty"><button onclick="change(-1)">−</button><input id="qty" type="number" min="1" max="${p.stok}" value="1"><button onclick="change(1)">+</button></div><button class="buy" ${p.stok<1?"disabled":""} onclick="add(p,Math.max(1,Math.min(Number(document.getElementById('qty').value)||1,p.stok)))">Sepete Ekle</button>${producer?`<div class="producer"><b>${esc(producer.firma_adi)}</b><br><small>${esc(producer.il||"")} / ${esc(producer.ilce||"")} • ${esc(producer.kategori||"")}</small></div>`:""}</div></div>`;
 window.p=p;
}
function change(n){const e=document.getElementById("qty");if(!e)return;e.value=Math.max(1,Math.min(Number(e.max)||999,(Number(e.value)||1)+n))}
count();load();
</script></body></html>
