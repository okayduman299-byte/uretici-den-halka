<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Üreticiden Halka müşteri girişi"><title>Müşteri Girişi | Üreticiden Halka</title><style>:root{--g:#166534;--ink:#17211b;--muted:#718078;--line:#dfe7df;--bg:#f5f8f4}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:linear-gradient(135deg,#eaf5e8,#f8fbf7);color:var(--ink);min-height:100vh;display:grid;place-items:center}.box{width:min(460px,calc(100% - 28px));background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 20px 60px rgba(24,53,31,.1)}.logo{text-align:center}.logo img{width:190px;max-height:58px;object-fit:contain}.back{display:block;text-align:center;color:var(--g);font-size:11px;font-weight:900;margin:12px 0 22px}.title{text-align:center}.title h1{margin:0 0 7px;font-size:27px}.title p{margin:0 0 22px;color:var(--muted);font-size:12px;line-height:1.6}.field{margin:11px 0}.field label{display:block;font-size:11px;font-weight:900;margin-bottom:6px}.field input{width:100%;height:45px;border:1px solid #d8e1d8;border-radius:10px;padding:0 12px;font:inherit;outline:0}.btn{width:100%;height:46px;border:0;border-radius:11px;background:var(--g);color:#fff;font-weight:950;cursor:pointer;margin-top:8px}.btn:disabled{opacity:.6}.secondary{display:block;text-align:center;margin-top:14px;color:var(--g);font-size:11px;font-weight:900}.msg{display:none;margin-top:12px;padding:11px;border-radius:10px;font-size:11px;line-height:1.5}.msg.err{background:#fff0f0;color:#991b1b}.msg.ok{background:#edf8ee;color:#166534}.note{text-align:center;color:var(--muted);font-size:10px;line-height:1.6;margin-top:20px}@media(max-width:500px){.box{padding:21px}.logo img{width:165px}}</style></head><body><main class="box"><div class="logo"><img src="logo (1).png" alt="Üreticiden Halka"></div><a class="back" href="index.html">← Alışverişe dön</a><div class="title"><h1>Müşteri Girişi</h1><p>Siparişlerini güvenli şekilde oluşturmak ve geçmiş siparişlerini takip etmek için giriş yap.</p></div><form id="form"><div class="field"><label>E-posta</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label>Şifre</label><input id="password" type="password" autocomplete="current-password" minlength="6" required></div><button class="btn" id="btn">Giriş Yap</button></form><div id="err" class="msg err"></div><div id="ok" class="msg ok"></div><a class="secondary" href="musteri-kayit.html">Hesabın yok mu? Müşteri hesabı oluştur</a><div class="note">Giriş yaparak hesabın üzerinden sipariş oluşturabilir ve sipariş takibini daha güvenli kullanabilirsin.</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient('https://bzudwfyxgbkzvfjhhywy.supabase.co','sb_publishable_a_gZqrURzUqY14KGJXbxxw_AgBbOxRu');const form=document.getElementById('form'),btn=document.getElementById('btn'),err=document.getElementById('err'),ok=document.getElementById('ok');form.addEventListener('submit',async e=>{e.preventDefault();err.style.display='none';ok.style.display='none';btn.disabled=true;btn.textContent='Giriş yapılıyor...';const {error}=await db.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error){err.textContent='Giriş yapılamadı: '+error.message;err.style.display='block';btn.disabled=false;btn.textContent='Giriş Yap';return}ok.textContent='Giriş başarılı. Sepetine dönüyorsun...';ok.style.display='block';setTimeout(()=>location.href='sepet.html',500)});</script></body></html>
