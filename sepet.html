<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sepetim | Üreticiden Halka</title>
<style>
:root{--g:#14532d;--g2:#166534;--ink:#17211b;--muted:#718078;--soft:#f5f8f4;--line:#e1e8e1}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--soft);color:var(--ink)}a{text-decoration:none;color:inherit}
.container{width:min(1120px,calc(100% - 30px));margin:auto}
header{position:sticky;top:0;z-index:20;background:#ffffffed;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{min-height:74px;display:flex;align-items:center;gap:18px}.logo img{width:190px;max-height:55px;object-fit:contain;display:block}.back{margin-left:auto;color:var(--g2);font-weight:900;font-size:13px}
.page{padding:32px 0 65px}.title{margin-bottom:24px}.title h1{margin:0 0 7px;font-size:34px;letter-spacing:-1px}.title p{margin:0;color:var(--muted);font-size:13px}
.layout{display:grid;grid-template-columns:1.45fr .8fr;gap:20px;align-items:start}.box{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 35px #18351f0a;padding:21px}
.box h2{margin:0 0 16px;font-size:19px}.items{display:grid;gap:0}.item{display:grid;grid-template-columns:92px 1fr auto;gap:15px;align-items:center;padding:15px 0;border-bottom:1px solid #edf1ed}.item:last-child{border-bottom:0}
.pic{width:92px;height:92px;border-radius:15px;background:linear-gradient(145deg,#eef4ec,#e1eae0);display:grid;place-items:center;overflow:hidden;font-size:35px}.pic img{width:100%;height:100%;object-fit:cover}
.item h3{margin:0 0 6px;font-size:15px}.cat{font-size:10px;color:#77847c}.price{font-size:15px;font-weight:950;margin-top:7px}.remove{border:0;background:none;color:#a11b1b;font-size:11px;font-weight:800;padding:0;margin-top:7px;cursor:pointer}
.qty{display:flex;align-items:center;border:1px solid #d8e1d8;border-radius:10px;overflow:hidden}.qty button{width:31px;height:32px;border:0;background:#f6f8f5;cursor:pointer;font-size:17px}.qty b{width:34px;text-align:center;font-size:12px}
.empty{text-align:center;padding:55px 20px;color:var(--muted)}.empty-icon{font-size:50px;margin-bottom:10px}.empty a{display:inline-block;margin-top:15px;background:var(--g2);color:#fff;padding:11px 15px;border-radius:10px;font-size:12px;font-weight:900}
.summary{position:sticky;top:96px}.sumrow{display:flex;justify-content:space-between;gap:15px;margin:12px 0;font-size:13px}.sumrow span:first-child{color:var(--muted)}.total{border-top:1px solid var(--line);padding-top:17px;margin-top:18px;font-size:21px;font-weight:950}.free{color:var(--g2);font-weight:900}
.payment{margin-top:20px}.payment h3{font-size:13px;margin:0 0 10px}.payoption{display:block;border:1px solid #dce4dc;border-radius:12px;padding:13px;margin-top:8px;cursor:pointer}.payoption:has(input:checked){border-color:#76a581;background:#f4faf3;box-shadow:0 0 0 2px #16653412}.payoption input{margin-right:8px}.payoption b{font-size:12px}.payoption small{display:block;color:var(--muted);font-size:10px;margin:5px 0 0 25px;line-height:1.5}
.form{display:grid;gap:10px;margin-top:20px}.form input,.form textarea{width:100%;border:1px solid #d8e1d8;border-radius:10px;padding:12px;font:inherit;outline:0}.form input:focus,.form textarea:focus{border-color:#83a88b;box-shadow:0 0 0 3px #1665340d}.form textarea{min-height:86px;resize:vertical}.checkout{width:100%;height:48px;border:0;border-radius:11px;background:var(--g2);color:#fff;font-weight:950;cursor:pointer}.checkout:disabled{opacity:.55;cursor:not-allowed}.err{display:none;background:#fff0f0;color:#991b1b;padding:11px;border-radius:10px;font-size:12px}
.note{margin-top:14px;padding:12px;border-radius:11px;background:#f5f8f4;color:#68756c;font-size:10px;line-height:1.6}.security{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.security div{background:#f7faf6;border-radius:10px;padding:10px;text-align:center;font-size:9px;font-weight:800}.security span{display:block;font-size:17px;margin-bottom:3px}
.toast{position:fixed;right:18px;bottom:18px;background:#102219;color:#fff;padding:13px 16px;border-radius:12px;font-size:12px;font-weight:800;opacity:0;transform:translateY(15px);transition:.2s;z-index:50}.toast.show{opacity:1;transform:none}
@media(max-width:820px){.layout{grid-template-columns:1fr}.summary{position:static}}
@media(max-width:560px){.logo img{width:165px}.item{grid-template-columns:70px 1fr}.pic{width:70px;height:70px}.qty{grid-column:2}.title h1{font-size:29px}.box{padding:16px}}
</style>
<link rel="stylesheet" href="site-polish.css">
</head>
<body>
<header><div class="container nav"><a class="logo" href="index.html"><img src="logo (1).png" alt="Üreticiden Halka"></a><a class="back" href="index.html">← Alışverişe devam et</a></div></header>
<main class="container page"><div class="title"><h1>Sepetim</h1><p>Seçtiğin ürünleri kontrol et ve siparişini tamamla.</p></div><div id="main"></div></main>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=window.supabase.createClient("https://bzudwfyxgbkzvfjhhywy.supabase.co","sb_publishable_a_gZqrURzUqY14KGJXbxxw_AgBbOxRu");
const $=id=>document.getElementById(id),main=$("main");
function cart(){try{return JSON.parse(localStorage.getItem("uh_cart")||"[]")}catch{return[]}}
function save(c){localStorage.setItem("uh_cart",JSON.stringify(c));render()}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":">","\"":"&quot;","'":"&#039;"}[m]))}
function money(v){return Number(v||0).toLocaleString("tr-TR",{minimumFractionDigits:2})+" ₺"}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove("show"),2000)}
function change(i,d){let c=cart(),n=Number(c[i].qty||1)+d;if(n<1){removeItem(i);return}if(n>Number(c[i].stock||999999)){toast("Stok sınırına ulaştınız.");return}c[i].qty=n;save(c)}
function removeItem(i){let c=cart();c.splice(i,1);save(c)}
function render(){
 const c=cart();
 if(!c.length){main.innerHTML='<div class="box empty"><div class="empty-icon">🛒</div><b>Sepetiniz şu anda boş.</b><div>Ürünleri keşfedip alışverişe başlayabilirsiniz.</div><a href="index.html">Ürünleri keşfet →</a></div>';return}
 const total=c.reduce((s,x)=>s+Number(x.price||0)*Number(x.qty||0),0);
 main.innerHTML='<div class="layout"><section class="box"><h2>Sepetindeki Ürünler <span style="color:#7a867f;font-size:12px">('+c.reduce((n,x)=>n+Number(x.qty||0),0)+')</span></h2><div class="items">'+c.map((x,i)=>'<div class="item"><div class="pic">'+(x.image?'<img src="'+esc(x.image)+'" alt="'+esc(x.name)+'">':'🧺')+'</div><div><div class="cat">'+esc(x.category||"Yerel ürün")+'</div><h3>'+esc(x.name)+'</h3><div class="price">'+money(x.price)+'</div><button class="remove" onclick="removeItem('+i+')">Kaldır</button></div><div class="qty"><button onclick="change('+i+',-1)">−</button><b>'+x.qty+'</b><button onclick="change('+i+',1)">+</button></div></div>').join("")+'</div></section><aside class="box summary"><h2>Sipariş Özeti</h2><div class="sumrow"><span>Ara toplam</span><b>'+money(total)+'</b></div><div class="sumrow"><span>Kargo</span><b class="free">Ücretsiz</b></div><div class="sumrow total"><span>Toplam</span><span>'+money(total)+'</span></div><div class="payment"><h3>Ödeme yöntemi</h3><label class="payoption"><input type="radio" name="payment" value="kapida" checked><b>Kapıda Ödeme</b><small>Sipariş teslim edilirken ödeme yaparsın.</small></label><label class="payoption"><input type="radio" name="payment" value="havale"><b>Havale / EFT</b><small>Siparişi oluşturduktan sonra banka bilgilerini ve ödeme bildirimini görebilirsin.</small></label></div><div class="form"><input id="name" placeholder="Ad Soyad *"><input id="phone" placeholder="Telefon *"><input id="email" type="email" placeholder="E-posta"><textarea id="address" placeholder="Teslimat adresi *"></textarea><div id="err" class="err"></div><button class="checkout" id="checkout" onclick="placeOrder()">Siparişi Oluştur →</button></div><div class="note">Siparişini oluşturduktan sonra sipariş numaranı sakla. Havale/EFT seçersen ödeme bildirimi ayrıca yapılabilir.</div><div class="security"><div>🔒<br>Güvenli sipariş</div><div>📦<br>Sipariş takibi</div><div>✓<br>Üreticiden</div></div></aside></div>';
}
async function placeOrder(){
 const c=cart(),name=$("name").value.trim(),phone=$("phone").value.trim(),email=$("email").value.trim(),address=$("address").value.trim(),payment=document.querySelector('input[name="payment"]:checked')?.value||"kapida",err=$("err"),button=$("checkout");
 err.style.display="none";
 if(!name||!phone||!address){err.textContent="Ad Soyad, telefon ve teslimat adresi zorunludur.";err.style.display="block";return}
 button.disabled=true;button.textContent="Sipariş oluşturuluyor...";
 try{
  const r=await db.rpc("place_order",{p_customer_name:name,p_customer_phone:phone,p_customer_email:email||null,p_address:address,p_items:c.map(x=>({product_id:x.id,quantity:x.qty})),p_payment_method:payment});
  if(r.error)throw r.error;
  localStorage.setItem("uh_last_payment",payment);localStorage.removeItem("uh_cart");
  location.href="siparis-sonuc.html?no="+encodeURIComponent(r.data);
 }catch(e){err.textContent="Sipariş oluşturulamadı: "+(e.message||"Bilinmeyen hata");err.style.display="block";button.disabled=false;button.textContent="Siparişi Oluştur →"}
}
render();
</script>
</body>
</html>
