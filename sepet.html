<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sepetim | Üreticiden Halka</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7faf7;color:#17211b}a{text-decoration:none;color:inherit}
.container{width:min(1100px,calc(100% - 28px));margin:auto}header{background:#fff;border-bottom:1px solid #e5e9e5}.nav{height:72px;display:flex;align-items:center;gap:18px}.logo{font-size:20px;font-weight:800;color:#166534}.logo span{color:#17211b}.back{margin-left:auto;color:#166534;font-weight:700}
h1{margin:35px 0 20px}.layout{display:grid;grid-template-columns:1.6fr 1fr;gap:22px;margin-bottom:50px}.box{background:#fff;border:1px solid #e1e7e1;border-radius:20px;padding:20px}
.item{display:grid;grid-template-columns:90px 1fr auto;gap:15px;align-items:center;padding:14px 0;border-bottom:1px solid #edf0ed}.item:last-child{border-bottom:0}.pic{width:90px;height:90px;border-radius:12px;background:#eef2ec;display:grid;place-items:center;font-size:35px;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}.item h3{margin:0 0 6px;font-size:15px}.muted{color:#758078;font-size:12px}.price{font-weight:800;margin-top:6px}.qty{display:flex;align-items:center;gap:8px}.qty button{width:30px;height:30px;border:1px solid #d8e0d8;background:#fff;border-radius:8px;cursor:pointer}.remove{border:0;background:none;color:#b91c1c;font-size:12px;cursor:pointer;margin-top:7px}.sum{display:flex;justify-content:space-between;margin:10px 0}.total{font-size:22px;font-weight:900;border-top:1px solid #e1e7e1;padding-top:15px}.checkout{display:block;width:100%;border:0;border-radius:12px;background:#166534;color:#fff;padding:14px;font-weight:800;cursor:pointer;margin-top:18px}.empty{text-align:center;padding:55px;color:#718078}.form{display:grid;gap:12px}.form input,.form textarea{width:100%;border:1px solid #dce3dc;border-radius:10px;padding:12px;font:inherit}.form textarea{min-height:90px}.err{display:none;background:#fee2e2;color:#991b1b;border-radius:10px;padding:10px;font-size:13px}.success{display:none;text-align:center;padding:40px}.success b{font-size:25px;color:#166534}
@media(max-width:800px){.layout{grid-template-columns:1fr}.item{grid-template-columns:70px 1fr}.qty{grid-column:2}.pic{width:70px;height:70px}}
</style></head>
<body><header><div class="container nav"><a class="logo" href="index.html">Üreticiden <span>Halka</span></a><a class="back" href="index.html">← Alışverişe dön</a></div></header>
<main class="container"><h1>Sepetim</h1><div id="main"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://bzudwfyxgbkzvfjhhywy.supabase.co",SUPABASE_KEY="sb_publishable_a_gZqrURzUqY14KGJXbxxw_AgBbOxRu";
const db=window.supabase.createClient(SUPABASE_URL.trim(),SUPABASE_KEY.trim()),main=document.getElementById("main");
function cart(){try{return JSON.parse(localStorage.getItem("uh_cart")||"[]")}catch(e){return[]}}
function save(c){localStorage.setItem("uh_cart",JSON.stringify(c));render()}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function render(){
 const c=cart();
 if(!c.length){main.innerHTML='<div class="box empty">Sepetiniz şu anda boş.<br><br><a href="index.html" style="color:#166534;font-weight:800">Ürünleri keşfet →</a></div>';return}
 let total=c.reduce((s,x)=>s+x.price*x.qty,0);
 main.innerHTML=`<div class="layout"><div class="box"><h2>Sepetiniz</h2>${c.map((x,i)=>`<div class="item"><div class="pic">${x.image?`<img src="${esc(x.image)}">`:"🧺"}</div><div><h3>${esc(x.name)}</h3><div class="muted">${esc(x.category)}</div><div class="price">${x.price.toLocaleString("tr-TR",{minimumFractionDigits:2})} ₺</div><button class="remove" onclick="removeItem(${i})">Kaldır</button></div><div class="qty"><button onclick="changeQty(${i},-1)">−</button><b>${x.qty}</b><button onclick="changeQty(${i},1)">+</button></div></div>`).join("")}</div>
 <div class="box"><h2>Sipariş Bilgileri</h2><div class="sum"><span>Ara toplam</span><b>${total.toLocaleString("tr-TR",{minimumFractionDigits:2})} ₺</b></div><div class="sum"><span>Kargo</span><b>Ücretsiz</b></div><div class="sum total"><span>Toplam</span><span>${total.toLocaleString("tr-TR",{minimumFractionDigits:2})} ₺</span></div>
 <div class="form"><input id="name" placeholder="Ad Soyad *"><input id="phone" placeholder="Telefon *"><input id="email" type="email" placeholder="E-posta"><textarea id="address" placeholder="Teslimat adresi *"></textarea><div id="err" class="err"></div><button class="checkout" onclick="placeOrder()">Siparişi Oluştur →</button></div></div></div>`;
}
function changeQty(i,d){let c=cart(),n=c[i].qty+d;if(n<1)return removeItem(i);if(n>c[i].stock){alert("Stok sınırına ulaştınız.");return}c[i].qty=n;save(c)}
function removeItem(i){let c=cart();c.splice(i,1);save(c)}
async function placeOrder(){
 const c=cart(), name=document.getElementById("name").value.trim(),phone=document.getElementById("phone").value.trim(),email=document.getElementById("email").value.trim(),address=document.getElementById("address").value.trim(),err=document.getElementById("err");
 err.style.display="none";if(!name||!phone||!address){err.textContent="Ad Soyad, telefon ve teslimat adresi zorunludur.";err.style.display="block";return}
 if(!c.length)return;
 const {data,error}=await db.rpc("place_order",{p_customer_name:name,p_customer_phone:phone,p_customer_email:email||null,p_address:address,p_items:c.map(x=>({product_id:x.id,quantity:x.qty}))});
 if(error){console.error(error);err.textContent="Sipariş oluşturulamadı: "+error.message;err.style.display="block";return}
 localStorage.removeItem("uh_cart");
 main.innerHTML=`<div class="box success"><b>✓ Siparişiniz alındı</b><p>Sipariş numaranız: <strong>${esc(data)}</strong></p><p>En kısa sürede sizinle iletişime geçeceğiz.</p><a href="index.html" style="color:#166534;font-weight:800">Alışverişe devam et →</a></div>`;
}
render();
</script></body></html>
