<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sepet | Üreticiden Halka</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7faf7;color:#17211b}.container{width:min(1050px,calc(100% - 28px));margin:auto}
header{background:#fff;border-bottom:1px solid #e4e9e4}.nav{height:70px;display:flex;align-items:center;gap:15px}.logo{font-size:20px;font-weight:900;color:#166534}.logo span{color:#17211b}.back{margin-left:auto;color:#526158;font-weight:700}
main{padding:30px 0}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}.card{background:#fff;border:1px solid #e0e7e0;border-radius:18px;padding:22px}.item{display:grid;grid-template-columns:80px 1fr auto;gap:14px;align-items:center;border-bottom:1px solid #edf1ed;padding:14px 0}.item:last-child{border:0}.thumb{width:80px;height:80px;border-radius:12px;background:#eef2ec;display:grid;place-items:center;font-size:35px;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.name{font-weight:800}.muted{font-size:13px;color:#748078}.controls{display:flex;gap:7px;align-items:center;margin-top:8px}.controls button{width:30px;height:30px;border:1px solid #d8e0d8;background:#fff;border-radius:7px}.controls input{width:38px;text-align:center;height:30px;border:1px solid #d8e0d8;border-radius:7px}.remove{border:0;background:transparent;color:#b42318;cursor:pointer}.total{display:flex;justify-content:space-between;font-size:21px;font-weight:900;margin:18px 0}.form{display:grid;gap:10px}.form input,.form textarea{width:100%;padding:12px;border:1px solid #d7e0d7;border-radius:10px;font:inherit}.form textarea{min-height:100px;resize:vertical}.submit{width:100%;height:48px;border:0;border-radius:11px;background:#166534;color:#fff;font-weight:800;cursor:pointer}.notice{padding:12px;border-radius:10px;background:#f2f7f1;color:#526158;font-size:13px}.empty{text-align:center;padding:50px;color:#748078}.success{padding:25px;text-align:center}.orderNo{font-size:28px;font-weight:900;color:#166534}@media(max-width:750px){.grid{grid-template-columns:1fr}.item{grid-template-columns:65px 1fr}.item>.right{grid-column:2}.thumb{width:65px;height:65px}}
</style></head><body>
<header><div class="container nav"><a class="logo" href="index.html">Üreticiden <span>Halka</span></a><a class="back" href="index.html">← Alışverişe dön</a></div></header>
<main><div class="container"><h1>Sepetim</h1><div id="app" class="grid"><div class="card"><div class="empty">Sepet yükleniyor...</div></div></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient("https://bzudwfyxgbkzvfjhhywy.supabase.co","sb_publishable_a_gZqrURzUqY14KGJXbxxw_AgBbOxRu");
function get(){try{return JSON.parse(localStorage.getItem("uh_cart")||"[]")}catch{return[]}}
function save(c){localStorage.setItem("uh_cart",JSON.stringify(c));render()}
function money(n){return Number(n||0).toLocaleString("tr-TR",{minimumFractionDigits:2})+" ₺"}
function render(){
 const c=get(), app=document.getElementById("app");
 if(!c.length){app.innerHTML='<div class="card" style="grid-column:1/-1"><div class="empty">🛒<br><br>Sepetiniz boş.<br><br><a href="index.html" style="color:#166534;font-weight:800">Ürünleri keşfet →</a></div></div>';return}
 const total=c.reduce((s,x)=>s+Number(x.price)*Number(x.qty),0);
 app.innerHTML=`<div class="card"><h2>Ürünler</h2>${c.map((x,i)=>`<div class="item"><div class="thumb">${x.image?`<img src="${x.image}">`:"🧺"}</div><div><div class="name">${esc(x.name)}</div><div class="muted">${esc(x.category)}</div><div class="controls"><button onclick="change(${i},-1)">−</button><input value="${x.qty}" readonly><button onclick="change(${i},1)">+</button><button class="remove" onclick="removeItem(${i})">Kaldır</button></div></div><div class="right"><b>${money(x.price*x.qty)}</b></div></div>`).join("")}</div>
 <div class="card"><h2>Sipariş Bilgileri</h2><div class="notice">Ödeme adımında kapıda ödeme/manuel ödeme seçenekleri eklenebilir. Şimdilik sipariş güvenli şekilde veritabanına oluşturulur.</div><br><div class="form"><input id="name" placeholder="Ad Soyad *"><input id="phone" placeholder="Telefon *"><input id="email" type="email" placeholder="E-posta"><textarea id="address" placeholder="Teslimat adresi *"></textarea></div><div class="total"><span>Toplam</span><span>${money(total)}</span></div><button class="submit" onclick="place()">Siparişi Oluştur →</button><p id="err" class="muted"></p></div>`;
}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function change(i,n){let c=get(),x=c[i];x.qty=Math.max(1,Math.min(Number(x.stock)||999,x.qty+n));save(c)}
function removeItem(i){let c=get();c.splice(i,1);save(c)}
async function place(){
 const c=get(),err=document.getElementById("err");err.textContent="";
 const name=document.getElementById("name").value.trim(),phone=document.getElementById("phone").value.trim(),email=document.getElementById("email").value.trim(),address=document.getElementById("address").value.trim();
 if(!name||!phone||!address){err.textContent="Ad, telefon ve teslimat adresi zorunludur.";return}
 const btn=document.querySelector(".submit");btn.disabled=true;btn.textContent="Sipariş oluşturuluyor...";
 const items=c.map(x=>({product_id:Number(x.id),quantity:Number(x.qty)}));
 const r=await db.rpc("place_order",{p_customer_name:name,p_customer_phone:phone,p_customer_email:email,p_address:address,p_items:items});
 if(r.error){err.textContent=r.error.message||"Sipariş oluşturulamadı.";btn.disabled=false;btn.textContent="Siparişi Oluştur →";return}
 localStorage.removeItem("uh_cart");
 location.href="siparis-sonuc.html?no="+encodeURIComponent(r.data);
}
render();
</script></body></html>
