<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Üretici Başvuruları | Üreticiden Halka</title>
<style>
:root{--g:#166534;--dark:#102219;--bg:#f4f7f3;--line:#dfe7df;--muted:#718078;--red:#991b1b;--gold:#876900}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:#17211b}.wrap{width:min(1180px,calc(100% - 28px));margin:22px auto 60px}.top{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{width:175px;max-height:48px;object-fit:contain}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:900;cursor:pointer}.green{background:var(--g);color:#fff}.light{background:#edf3ed;color:var(--g)}.danger{background:#fee2e2;color:var(--red)}.login{max-width:430px;margin:70px auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 15px 45px #18351f10}.login img{display:block;width:180px;margin:0 auto 20px}.login h1{text-align:center;font-size:22px}.login p{color:var(--muted);font-size:12px;text-align:center}.login input{width:100%;padding:12px;border:1px solid #d7e0d7;border-radius:10px;margin-top:10px;font:inherit}.login .btn{width:100%;margin-top:12px}.panel{display:none}.head{margin:24px 0 15px}.head h1{margin:0;font-size:28px}.muted{color:var(--muted);font-size:12px;margin-top:5px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px}.stat span{font-size:11px;color:var(--muted)}.stat b{display:block;font-size:25px;margin-top:6px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;margin-top:15px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select{padding:11px;border:1px solid #d7e0d7;border-radius:10px;background:#fff;font:inherit}.toolbar input{flex:1;min-width:220px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:12px}.table th{text-align:left;color:var(--muted);font-size:10px;padding:11px;border-bottom:1px solid var(--line)}.table td{padding:13px 11px;border-bottom:1px solid #edf1ed;vertical-align:top}.badge{display:inline-block;padding:6px 9px;border-radius:99px;font-size:10px;font-weight:900}.pending{background:#fff7d6;color:var(--gold)}.active{background:#e7f6e9;color:var(--g)}.rejected{background:#fee2e2;color:var(--red)}.msg{display:none;padding:11px;border-radius:10px;margin-top:12px;font-size:12px}.ok{background:#e8f6e9;color:var(--g)}.err{background:#fff0f0;color:var(--red)}.modal{display:none;position:fixed;inset:0;background:#10221966;padding:20px;overflow:auto}.box{width:min(700px,100%);margin:25px auto;background:#fff;border-radius:20px;padding:22px}.boxhead{display:flex;justify-content:space-between;gap:12px}.line{padding:11px 0;border-bottom:1px solid #edf1ed;font-size:12px}.line b{display:inline-block;width:150px}.modal .actions{margin-top:16px}@media(max-width:650px){.stats{grid-template-columns:1fr}.top{align-items:flex-start}.logo{width:145px}.table{min-width:800px}.line b{display:block;width:auto;margin-bottom:4px}}
</style>
</head>
<body>
<div id="login" class="login"><img src="logo (1).png" alt="Üreticiden Halka"><h1>Üretici Başvuruları</h1><p>Yönetici girişi</p><input id="email" type="email" placeholder="Yönetici e-posta"><input id="password" type="password" placeholder="Şifre"><button class="btn green" onclick="login()">Giriş Yap</button><div id="loginMsg" class="msg err"></div></div>
<div id="panel" class="panel"><main class="wrap"><div class="top"><img class="logo" src="logo (1).png" alt="Üreticiden Halka"><div class="actions"><a class="btn light" href="admin.html">← Admin</a><button class="btn light" onclick="load()">↻ Yenile</button><button class="btn danger" onclick="logout()">Çıkış</button></div></div><div class="head"><h1>Üretici Başvuruları</h1><div class="muted">Başvuruları incele, bilgileri kontrol et ve üreticiyi aktif et.</div></div><div class="stats"><div class="stat"><span>Bekleyen</span><b id="pending">0</b></div><div class="stat"><span>Aktif</span><b id="active">0</b></div><div class="stat"><span>Reddedilen</span><b id="rejected">0</b></div></div><div class="card"><div class="toolbar"><input id="search" placeholder="Firma, yetkili, e-posta veya şehir ara..." oninput="render()"><select id="filter" onchange="render()"><option value="">Tümü</option><option value="Başvuru">Bekleyen</option><option value="Aktif">Aktif</option><option value="Reddedildi">Reddedildi</option></select></div><div id="table"></div><div id="msg" class="msg"></div></div></main></div>
<div id="modal" class="modal"><div class="box"><div class="boxhead"><h2 id="title">Başvuru</h2><button class="btn light" onclick="closeModal()">Kapat</button></div><div id="detail"></div><div id="modalActions" class="actions"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient('https://bzudwfyxgbkzvfjhhywy.supabase.co','sb_publishable_a_gZqrURzUqY14KGJXbxxw_AgBbOxRu');let rows=[];const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function badge(s){return s==='Aktif'?'<span class="badge active">Aktif</span>':s==='Reddedildi'?'<span class="badge rejected">Reddedildi</span>':'<span class="badge pending">Başvuru</span>'}function show(t,ok=false){$('msg').textContent=t;$('msg').className='msg '+(ok?'ok':'err');$('msg').style.display='block'}
async function login(){const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error){$('loginMsg').textContent=r.error.message;$('loginMsg').style.display='block';return}const a=await db.rpc('is_admin');if(a.error||a.data!==true){await db.auth.signOut();$('loginMsg').textContent='Bu hesap yönetici değil.';$('loginMsg').style.display='block';return}$('login').style.display='none';$('panel').style.display='block';await load()}
async function load(){const r=await db.from('ureticiler').select('*').order('created_at',{ascending:false});if(r.error){show(r.error.message);return}rows=r.data||[];render()}
function render(){const q=($('search').value||'').toLocaleLowerCase('tr-TR').trim(),f=$('filter').value;const list=rows.filter(x=>(!f||x.durum===f)&&(!q||[x.firma_adi,x.yetkili,x.email,x.telefon,x.il,x.ilce,x.kategori].join(' ').toLocaleLowerCase('tr-TR').includes(q)));$('pending').textContent=rows.filter(x=>x.durum==='Başvuru').length;$('active').textContent=rows.filter(x=>x.durum==='Aktif').length;$('rejected').textContent=rows.filter(x=>x.durum==='Reddedildi').length;if(!list.length){$('table').innerHTML='<div class="muted" style="padding:35px;text-align:center">Kayıt bulunamadı.</div>';return}$('table').innerHTML='<div class="tablewrap"><table class="table"><thead><tr><th>Firma / Çiftlik</th><th>Yetkili</th><th>Konum</th><th>E-posta</th><th>Durum</th><th></th></tr></thead><tbody>'+list.map(x=>'<tr><td><b>'+esc(x.firma_adi)+'</b><br><small>'+esc(x.kategori||'-')+'</small></td><td>'+esc(x.yetkili||'-')+'<br>'+esc(x.telefon||'-')+'</td><td>'+esc(x.il||'-')+' / '+esc(x.ilce||'-')+'<br>'+esc(x.mahalle||'')+'</td><td>'+esc(x.email||'-')+'</td><td>'+badge(x.durum)+'</td><td><button class="btn light" onclick="openDetail('+Number(x.id)+')">İncele</button></td></tr>').join('')+'</tbody></table></div>'}
function openDetail(id){const x=rows.find(r=>Number(r.id)===Number(id));if(!x)return;$('title').textContent=x.firma_adi||'Üretici başvurusu';$('detail').innerHTML='<div class="line"><b>Durum</b>'+badge(x.durum)+'</div><div class="line"><b>Yetkili</b>'+esc(x.yetkili)+'</div><div class="line"><b>E-posta</b>'+esc(x.email)+'</div><div class="line"><b>Telefon</b>'+esc(x.telefon)+'</div><div class="line"><b>Konum</b>'+esc(x.il)+' / '+esc(x.ilce)+'</div><div class="line"><b>Mahalle</b>'+esc(x.mahalle)+'</div><div class="line"><b>Cadde / Sokak</b>'+esc(x.cadde)+'</div><div class="line"><b>Bina No</b>'+esc(x.bina_no)+'</div><div class="line"><b>Açık Adres</b>'+esc(x.adres)+'</div><div class="line"><b>Kategori</b>'+esc(x.kategori)+'</div><div class="line"><b>E-posta doğrulandı</b>'+((x.email_verified)?'Evet':'Hayır')+'</div><div class="line"><b>Başvuru tarihi</b>'+esc(x.created_at?new Date(x.created_at).toLocaleString('tr-TR'):'-')+'</div>'+(x.red_nedeni?'<div class="line"><b>Red nedeni</b>'+esc(x.red_nedeni)+'</div>':'');let a='';if(x.durum==='Başvuru')a='<button class="btn green" onclick="approve('+Number(x.id)+')">✓ Onayla</button><button class="btn danger" onclick="reject('+Number(x.id)+')">✕ Reddet</button>';else if(x.durum==='Reddedildi')a='<button class="btn green" onclick="approve('+Number(x.id)+')">Tekrar Onayla</button>';else a='<button class="btn danger" onclick="reject('+Number(x.id)+')">Reddet</button>';$('modalActions').innerHTML=a;$('modal').style.display='block'}
function closeModal(){$('modal').style.display='none'}async function status(id,durum,red=''){const r=await db.rpc('admin_update_uretici_durum',{p_id:id,p_durum:durum,p_red_nedeni:red});if(r.error){show(r.error.message);return}show(durum==='Aktif'?'Üretici aktif edildi.':'Başvuru reddedildi.',true);closeModal();await load()}function approve(id){if(confirm('Bu üreticiyi aktif etmek istiyor musun?'))status(id,'Aktif')}function reject(id){const reason=prompt('Red nedeni (opsiyonel):');if(reason===null)return;status(id,'Reddedildi',reason)}async function logout(){await db.auth.signOut();location.reload()}window.addEventListener('load',async()=>{const s=await db.auth.getSession();if(s.data.session){const a=await db.rpc('is_admin');if(!a.error&&a.data===true){$('login').style.display='none';$('panel').style.display='block';await load()}}});
</script></body></html>
