name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-wrapper/**'
      - '.github/workflows/android-apk.yml'
      - '*.html'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: android-wrapper/package.json

      - name: Install dependencies
        working-directory: android-wrapper
        run: npm install

      - name: Prepare Capacitor web directory
        working-directory: android-wrapper
        run: |
          rm -rf android www
          mkdir -p www
          cat > www/index.html <<'EOF'
          <!doctype html>
          <html lang="tr">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Üreticiden Halka</title>
          </head>
          <body></body>
          </html>
          EOF

      - name: Install Capacitor Android
        working-directory: android-wrapper
        run: |
          npx cap add android
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: android-wrapper/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ureticiden-halka-apk
          path: android-wrapper/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
