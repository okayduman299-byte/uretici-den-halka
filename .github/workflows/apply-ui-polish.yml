name: Apply global UI polish

on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix homepage producer listing query
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='const ur=await db.from("ureticiler_public").select("id,firma_adi,il,ilce,kategori,durum").eq("durum","Aktif").order("created_at",{ascending:false}).limit(6);'
          new='const ur=await db.from("ureticiler_public").select("id,firma_adi,il,ilce,kategori,durum").eq("durum","Aktif").order("id",{ascending:false}).limit(6);'
          if old not in s:
              raise SystemExit('Producer query pattern not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Add shared UI polish to HTML pages
        shell: python
        run: |
          from pathlib import Path
          link='<link rel="stylesheet" href="site-polish.css">'
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              if link not in s:
                  s=s.replace('</head>', link+'\n</head>', 1)
                  p.write_text(s, encoding='utf-8')
      - name: Commit polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' site-polish.css
          git diff --cached --quiet || git commit -m 'Fix homepage producer listing query'
          git push
