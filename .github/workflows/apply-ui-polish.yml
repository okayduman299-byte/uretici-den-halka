name: Apply global UI polish

on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add shared UI polish to HTML pages
        shell: python
        run: |
          from pathlib import Path
          link='<link rel="stylesheet" href="site-polish.css">'
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              if link not in s:
                  s=s.replace('</head>', link+'\n</head>', 1)
                  p.write_text(s, encoding='utf-8')
      - name: Commit polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' site-polish.css
          git diff --cached --quiet || git commit -m 'Apply professional responsive UI polish'
          git push
