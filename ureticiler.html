<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Üreticiler | Üreticiden Halka</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7faf7;color:#17211b}.container{width:min(1120px,calc(100% - 28px));margin:auto}header{height:70px;background:#fff;border-bottom:1px solid #e3e9e3}.nav{height:100%;display:flex;align-items:center;justify-content:space-between}.logo{font-size:21px;font-weight:900;color:#166534;text-decoration:none}.logo span{color:#17211b}.back{color:#526158;font-weight:800;text-decoration:none}.hero{background:linear-gradient(135deg,#edf7ed,#f8fbf7);padding:42px 0}.hero h1{font-size:38px;margin:0 0 8px}.hero p{margin:0;color:#6d7971;max-width:620px;line-height:1.6}.tools{display:flex;gap:10px;margin:22px 0}.search,select{height:46px;border:1px solid #d7e0d7;border-radius:11px;background:#fff;padding:0 13px;font:inherit}.search{flex:1}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding-bottom:40px}.card{background:#fff;border:1px solid #e0e7e0;border-radius:18px;padding:20px;transition:.15s}.card:hover{transform:translateY(-2px);box-shadow:0 10px 25px #1932200c}.avatar{width:64px;height:64px;border-radius:17px;background:#eaf3e9;display:grid;place-items:center;color:#166534;font-size:25px;font-weight:900;margin-bottom:15px}.name{font-size:19px;font-weight:900}.meta{font-size:13px;color:#718078;margin-top:7px}.badge{display:inline-block;margin-top:12px;padding:6px 9px;border-radius:20px;background:#e5f6e7;color:#166534;font-size:11px;font-weight:900}.open{display:block;margin-top:17px;background:#166534;color:#fff;text-align:center;padding:11px;border-radius:10px;text-decoration:none;font-weight:900}.empty{grid-column:1/-1;background:#fff;border:1px dashed #cfd8d0;border-radius:18px;padding:55px;text-align:center;color:#718078}.error{grid-column:1/-1;background:#fff0f0;border:1px solid #ffd2d2;color:#991b1b;border-radius:14px;padding:18px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid{grid-template-columns:1fr}.tools{flex-direction:column}.hero h1{font-size:32px}}</style><link rel="stylesheet" href="site-polish.css"></head><body>
<header><div class="container nav"><a class="logo" href="index.html">Üreticiden <span>Halka</span></a><div><a class="back" href="index.html">← Ana sayfa</a> &nbsp; <a class="back" href="sepet.html">🛒 Sepet</a></div></div></header>
<section class="hero"><div class="container"><h1>Üreticiler</h1><p>Yerel üreticileri keşfedin, mağazalarına girin ve ürünleri doğrudan üreticiden satın alın.</p></div></section>
<main class="container"><div class="tools"><input id="search" class="search" placeholder="Üretici, il, ilçe veya kategori ara..."><select id="category"><option value="all">Tüm kategoriler</option></select></div><div id="grid" class="grid"><div class="empty">Üreticiler yükleniyor...</div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient("https://bzudwfyxgbkzvfjhhywy.supabase.co","sb_publishable_a_gZqrURzUqY14KGJXbxxw_AgBbOxRu");
const $=id=>document.getElementById(id);const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":">",'"':"&quot;","'":"&#039;"}[m]));let producers=[];
async function load(){try{const r=await db.from("ureticiler_public").select("id,firma_adi,il,ilce,kategori,durum").eq("durum","Aktif").order("firma_adi",{ascending:true});if(r.error)throw r.error;producers=r.data||[];const cats=[...new Set(producers.map(x=>x.kategori).filter(Boolean))];$("category").innerHTML='<option value="all">Tüm kategoriler</option>'+cats.map(x=>'<option>'+esc(x)+'</option>').join("");render()}catch(e){$("grid").innerHTML='<div class="error"><b>Üreticiler yüklenemedi.</b><br><br>'+esc(e.message)+'</div>'}}
function render(){const q=$("search").value.trim().toLocaleLowerCase("tr-TR"),cat=$("category").value;const list=producers.filter(p=>{const t=[p.firma_adi,p.il,p.ilce,p.kategori].join(" ").toLocaleLowerCase("tr-TR");return(!q||t.includes(q))&&(cat==="all"||p.kategori===cat)});if(!list.length){$("grid").innerHTML='<div class="empty">Aradığınız kriterlere uygun aktif üretici bulunamadı.</div>';return}$("grid").innerHTML=list.map(p=>{const initial=esc((p.firma_adi||"Ü").trim().charAt(0).toUpperCase()),loc=[p.il,p.ilce].filter(Boolean).join(" / ");return `<article class="card"><div class="avatar">${initial}</div><div class="name">${esc(p.firma_adi)}</div><div class="meta">📍 ${esc(loc||"Konum belirtilmemiş")}</div><div class="meta">🏷️ ${esc(p.kategori||"Yerel üretici")}</div><div class="badge">✓ Aktif üretici</div><a class="open" href="uretici-magaza.html?id=${encodeURIComponent(p.id)}">Mağazayı Gör →</a></article>`}).join("")}
$("search").addEventListener("input",render);$("category").addEventListener("change",render);load();
</script></body></html>
