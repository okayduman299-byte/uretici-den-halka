<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Üreticiler | Üreticiden Halka</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;background:#f6f8f5;color:#17211b}
a{text-decoration:none;color:inherit}
.container{width:min(1180px,calc(100% - 30px));margin:auto}
header{background:#fff;border-bottom:1px solid #e3e8e3;position:sticky;top:0;z-index:20}
.nav{height:72px;display:flex;align-items:center;gap:24px}
.logo{font-size:21px;font-weight:900;color:#166534}
.logo span{color:#17211b}
.back{margin-left:auto;color:#166534;font-weight:800}
.hero{padding:45px 0 30px;background:linear-gradient(135deg,#eef7ed,#fff)}
.hero h1{margin:0 0 10px;font-size:42px}
.hero p{margin:0;color:#667269;font-size:16px}
.tools{padding:28px 0 15px;display:flex;gap:12px}
.search{flex:1;padding:14px 16px;border:1px solid #d8e0d8;border-radius:12px;background:#fff;font-size:15px}
select{padding:0 14px;border:1px solid #d8e0d8;border-radius:12px;background:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding:15px 0 60px}
.card{background:#fff;border:1px solid #e1e7e1;border-radius:18px;padding:22px;transition:.2s}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 30px #17211b12}
.avatar{width:64px;height:64px;border-radius:18px;background:#166534;color:#fff;display:grid;place-items:center;font-size:27px;font-weight:900;margin-bottom:15px}
.name{font-size:20px;font-weight:900;margin-bottom:7px}
.meta{font-size:13px;color:#6e7972;line-height:1.6}
.badge{display:inline-block;margin-top:12px;background:#e7f5e9;color:#166534;border-radius:20px;padding:6px 10px;font-size:11px;font-weight:800}
.open{display:block;margin-top:18px;background:#166534;color:#fff;text-align:center;padding:12px;border-radius:11px;font-weight:800}
.empty{grid-column:1/-1;background:#fff;border:1px dashed #cfd8d0;border-radius:18px;text-align:center;padding:55px;color:#718078}
.error{grid-column:1/-1;background:#fff0f0;border:1px solid #ffd2d2;color:#991b1b;border-radius:14px;padding:18px}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.grid{grid-template-columns:1fr}.tools{flex-direction:column}select{height:46px}.hero h1{font-size:32px}}
</style>
</head>
<body>
<header>
<div class="container nav">
<a class="logo" href="index.html">Üreticiden <span>Halka</span></a>
<a class="back" href="index.html">← Ana sayfa</a>
</div>
</header>

<section class="hero">
<div class="container">
<h1>Üreticiler</h1>
<p>Doğrudan üreticiden alışveriş yapın. Üreticinin mağazasını keşfedin.</p>
</div>
</section>

<main class="container">
<div class="tools">
<input id="search" class="search" placeholder="Üretici veya konum ara...">
<select id="category"><option value="all">Tüm kategoriler</option></select>
</div>
<div id="grid" class="grid"><div class="empty">Üreticiler yükleniyor...</div></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://bzudwfyxgbkzvfjhhywy.supabase.co";
const SUPABASE_KEY="sb_publishable_a_gZqrURzUqY14KGJXbxxw_AgBbOxRu";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
let producers=[];

async function load(){
 try{
  const r=await db.from("ureticiler")
   .select("id,firma_adi,il,ilce,kategori,durum")
   .eq("durum","Aktif")
   .order("firma_adi",{ascending:true});

  if(r.error)throw r.error;
  producers=r.data||[];

  const cats=[...new Set(producers.map(x=>x.kategori).filter(Boolean))];
  $("category").innerHTML='<option value="all">Tüm kategoriler</option>'+
    cats.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join("");

  render();
 }catch(e){
  $("grid").innerHTML='<div class="error"><b>Üreticiler yüklenemedi.</b><br><br>'+esc(e.message||"Bilinmeyen hata")+'</div>';
 }
}

function render(){
 const q=$("search").value.trim().toLocaleLowerCase("tr-TR");
 const cat=$("category").value;
 const list=producers.filter(p=>{
  const text=[p.firma_adi,p.il,p.ilce,p.kategori].join(" ").toLocaleLowerCase("tr-TR");
  return (!q||text.includes(q))&&(cat==="all"||p.kategori===cat);
 });

 if(!list.length){
  $("grid").innerHTML='<div class="empty">Aradığınız kriterlere uygun aktif üretici bulunamadı.</div>';
  return;
 }

 $("grid").innerHTML=list.map(p=>{
  const initial=esc((p.firma_adi||"Ü").trim().charAt(0).toUpperCase());
  const location=[p.il,p.ilce].filter(Boolean).join(" / ");
  return '<article class="card">'+
   '<div class="avatar">'+initial+'</div>'+
   '<div class="name">'+esc(p.firma_adi)+'</div>'+
   '<div class="meta">📍 '+esc(location||"Konum belirtilmemiş")+'</div>'+
   '<div class="meta">🏷️ '+esc(p.kategori||"Yerel üretici")+'</div>'+
   '<div class="badge">✓ Aktif üretici</div>'+
   '<a class="open" href="uretici-magaza.html?id='+encodeURIComponent(p.id)+'">Mağazayı Gör →</a>'+
  '</article>';
 }).join("");
}

$("search").addEventListener("input",render);
$("category").addEventListener("change",render);
load();
</script>
</body>
</html>
