<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Üreticiden Halka üretici mağazası"><title>Üretici Mağazası | Üreticiden Halka</title><style>:root{--g:#14532d;--g2:#166534;--ink:#17211b;--muted:#718078;--soft:#f5f8f4;--line:#e1e8e1}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--soft);color:var(--ink)}a{text-decoration:none;color:inherit}.container{width:min(1160px,calc(100% - 30px));margin:auto}header{position:sticky;top:0;z-index:20;background:#ffffffed;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.nav{min-height:74px;display:flex;align-items:center;gap:18px}.logo img{width:190px;max-height:55px;object-fit:contain;display:block}.back{margin-left:auto;color:var(--g2);font-weight:900;font-size:13px}.hero{padding:46px 0 36px;background:linear-gradient(135deg,#eaf5e8,#fff);border-bottom:1px solid var(--line)}.profile{display:flex;align-items:center;gap:20px}.avatar{width:92px;height:92px;border-radius:25px;background:linear-gradient(145deg,#166534,#0d4425);color:#fff;display:grid;place-items:center;font-size:37px;font-weight:950;box-shadow:0 12px 30px #16653425}h1{margin:0 0 8px;font-size:36px;letter-spacing:-1px}.meta{color:#66736b;font-size:13px}.verified{display:inline-flex;align-items:center;background:#e5f5e8;color:var(--g2);padding:7px 11px;border-radius:999px;font-size:11px;font-weight:900;margin-top:11px}.content{padding:28px 0 65px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}.toolbar h2{margin:0;font-size:23px}.toolbar p{margin:5px 0 0;color:var(--muted);font-size:12px}.search{width:310px;padding:13px 15px;border:1px solid #d9e1da;border-radius:12px;background:#fff;outline:0}.search:focus{border-color:#8db79a;box-shadow:0 0 0 3px #16653412}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;transition:.2s;box-shadow:0 7px 24px #17211b07}.card:hover{transform:translateY(-4px);box-shadow:0 16px 35px #17211b12}.pic{height:225px;background:linear-gradient(145deg,#eef4ec,#e1eae0);display:grid;place-items:center;font-size:55px;overflow:hidden;position:relative}.pic img{width:100%;height:100%;object-fit:cover}.tag{position:absolute;left:11px;top:11px;background:#fff;padding:6px 8px;border-radius:999px;color:var(--g2);font-size:9px;font-weight:950}.body{padding:16px}.cat{font-size:10px;color:#77847c;font-weight:800}.name{font-weight:950;font-size:16px;margin:6px 0}.desc{font-size:11px;color:#758078;line-height:1.5;min-height:34px}.bottom{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-top:15px}.price{font-size:19px;font-weight:950}.stock{font-size:10px;color:var(--g2);font-weight:800;margin-top:3px}.buy{border:0;background:var(--g2);color:#fff;border-radius:10px;padding:10px 12px;font-weight:900;cursor:pointer}.buy:hover{background:#0f4d27}.buy:disabled{background:#aab3ad;cursor:not-allowed}.empty,.error{background:#fff;border-radius:18px;padding:55px;text-align:center;grid-column:1/-1;color:var(--muted)}.error{color:#991b1b;background:#fff0f0}.shopbar{margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;align-items:center;justify-content:space-between;gap:15px}.shopbar b{font-size:13px}.shopbar span{font-size:11px;color:var(--muted)}.cartlink{background:var(--g2);color:#fff;padding:11px 15px;border-radius:10px;font-size:11px;font-weight:900}.toast{position:fixed;right:18px;bottom:18px;background:#102219;color:#fff;padding:13px 16px;border-radius:12px;font-size:12px;font-weight:800;opacity:0;transform:translateY(15px);transition:.2s;z-index:50}.toast.show{opacity:1;transform:none}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:720px){.grid{grid-template-columns:repeat(2,1fr)}.toolbar{align-items:stretch;flex-direction:column}.search{width:100%}.profile{align-items:flex-start}.avatar{width:72px;height:72px;font-size:28px}h1{font-size:29px}}@media(max-width:500px){.grid{grid-template-columns:1fr}.logo img{width:165px}.hero{padding:32px 0}.profile{gap:13px}.shopbar{flex-direction:column;align-items:stretch}.cartlink{text-align:center}}</style><link rel="stylesheet" href="site-polish.css"></head><body><header><div class="container nav"><a class="logo" href="index.html"><img src="logo (1).png" alt="Üreticiden Halka"></a><a class="back" href="index.html">← Alışverişe dön</a></div></header><section class="hero"><div class="container" id="profile"><div class="profile"><div class="avatar">🏡</div><div><h1>Üretici yükleniyor...</h1></div></div></div></section><main class="content"><div class="container"><div class="toolbar"><div><h2>Ürünler</h2><p>Bu üreticinin güncel ürünlerini keşfet.</p></div><input id="search" class="search" placeholder="Bu mağazada ara..."></div><div id="grid" class="grid"><div class="empty">Ürünler yükleniyor...</div></div><div class="shopbar"><div><b>Beğendiğin ürünleri sepete ekle</b><br><span>Siparişini tamamlamak için sepetine geçebilirsin.</span></div><a class="cartlink" href="sepet.html">🛒 Sepete Git</a></div></div></main><div class="toast" id="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient("https://bzudwfyxgbkzvfjhhywy.supabase.co","sb_publishable_a_gZqrURzUqY14KGJXbxxw_AgBbOxRu");const $=id=>document.getElementById(id);let products=[];const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));function cart(){try{return JSON.parse(localStorage.getItem("uh_cart")||"[]")}catch{return[]}}function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove("show"),2000)}function add(p){let c=cart(),x=c.find(i=>Number(i.id)===Number(p.id));if(x){if(Number(x.qty)>=Number(p.stok))return toast("Stok sınırına ulaştınız.");x.qty++}else c.push({id:p.id,name:p.urun_adi,category:p.kategori||"",price:Number(p.fiyat||0),stock:Number(p.stok||0),image:p.gorsel_url||"",producer_id:p.uretici_id||null,qty:1});localStorage.setItem("uh_cart",JSON.stringify(c));toast("Ürün sepete eklendi ✓")}async function load(){const id=new URLSearchParams(location.search).get("id");if(!id){$("profile").innerHTML='<div class="error">Üretici bulunamadı.</div>';return}const r=await db.from("ureticiler_public").select("id,firma_adi,il,ilce,kategori,durum").eq("id",id).eq("durum","Aktif").maybeSingle();if(r.error||!r.data){$("profile").innerHTML='<div class="error">Üretici bulunamadı veya mağaza aktif değil.</div>';return}const p=r.data;$("profile").innerHTML='<div class="profile"><div class="avatar">'+esc((p.firma_adi||"Ü").charAt(0).toUpperCase())+'</div><div><h1>'+esc(p.firma_adi)+'</h1><div class="meta">📍 '+esc([p.il,p.ilce].filter(Boolean).join(" / "))+' • '+esc(p.kategori||"Yerel üretici")+'</div><div class="verified">✓ Doğrulanmış üretici</div></div></div>';const pr=await db.from("urunler").select("id,uretici_id,urun_adi,aciklama,kategori,fiyat,stok,gorsel_url,aktif").eq("uretici_id",p.id).eq("aktif",true).order("created_at",{ascending:false});if(pr.error){$("grid").innerHTML='<div class="error">'+esc(pr.error.message)+'</div>';return}products=pr.data||[];render()}function render(){const q=$("search").value.trim().toLocaleLowerCase("tr-TR");const list=products.filter(p=>[p.urun_adi,p.kategori,p.aciklama].join(" ").toLocaleLowerCase("tr-TR").includes(q));if(!list.length){$("grid").innerHTML='<div class="empty">Bu mağazada aradığınız ürün bulunamadı.</div>';return}$("grid").innerHTML=list.map(p=>'<article class="card"><a href="urun.html?id='+encodeURIComponent(p.id)+'"><div class="pic">'+(p.gorsel_url?'<img src="'+esc(p.gorsel_url)+'" alt="'+esc(p.urun_adi)+'">':'🧺')+'<span class="tag">ÜRETİCİDEN</span></div></a><div class="body"><div class="cat">'+esc(p.kategori||"Ürün")+'</div><div class="name">'+esc(p.urun_adi)+'</div><div class="desc">'+esc(p.aciklama||"Doğrudan üreticiden.")+'</div><div class="bottom"><div><div class="price">'+Number(p.fiyat||0).toLocaleString("tr-TR",{minimumFractionDigits:2})+' ₺</div><div class="stock">'+(p.stok>0?"✓ Stokta • "+p.stok+" adet":"Stok tükendi")+'</div></div><button class="buy" '+(p.stok<1?"disabled":"")+' onclick="event.preventDefault();add('+JSON.stringify(p).replace(/"/g,"&quot;")+')">Sepete ekle</button></div></div></article>').join("")}$("search").addEventListener("input",render);load();</script></body></html>
