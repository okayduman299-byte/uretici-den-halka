<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Üretici Girişi | Üreticiden Halka</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f8f4;color:#17211b;min-height:100vh;display:grid;place-items:center}.wrap{width:min(460px,calc(100% - 28px))}.logo{text-align:center;font-size:24px;font-weight:900;color:#166534;margin-bottom:18px}.logo span{color:#17211b}.card{background:#fff;border:1px solid #dfe7df;border-radius:20px;padding:26px;box-shadow:0 12px 40px #1932200b}.tabs{display:flex;gap:8px;margin-bottom:20px}.tab{flex:1;padding:11px;border:1px solid #d9e2d9;background:#fff;border-radius:10px;font-weight:800;cursor:pointer}.tab.active{background:#166534;color:#fff}.field{margin-bottom:12px}.field label{font-size:13px;font-weight:800;display:block;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #d8e1d8;border-radius:10px;font:inherit}.btn{width:100%;height:46px;border:0;border-radius:10px;background:#166534;color:#fff;font-weight:900;cursor:pointer}.msg{display:none;margin-top:12px;padding:11px;border-radius:9px;font-size:13px}.err{background:#fff0f0;color:#991b1b}.ok{background:#edf7ed;color:#166534}.small{font-size:12px;color:#718078;line-height:1.5;margin-top:12px;text-align:center}.links{text-align:center;margin-top:16px}.links a{color:#166534;font-weight:800;text-decoration:none;font-size:13px}</style></head><body><div class="wrap"><div class="logo">Üreticiden <span>Halka</span></div><div class="card"><div class="tabs"><button class="tab active" id="loginTab">Giriş Yap</button><button class="tab" id="signupTab">Hesap Oluştur</button></div>
<form id="form"><div class="field"><label>E-posta</label><input id="email" type="email" required placeholder="Başvuruda kullandığınız e-posta"></div><div class="field"><label>Şifre</label><input id="password" type="password" minlength="6" required placeholder="En az 6 karakter"></div><button class="btn" id="submit">Giriş Yap</button></form><div id="msg" class="msg"></div><div class="small" id="hint">Başvurunuz admin tarafından onaylandıysa hesabınız mağazanıza bağlanır.</div><div class="links"><a href="index.html">← Ana sayfaya dön</a></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient("https://bzudwfyxgbkzvfjhhywy.supabase.co","sb_publishable_a_gZqrURzUqY14KGJXbxxw_AgBbOxRu");let mode="login";const $=id=>document.getElementById(id),msg=$("msg");
function setMode(m){mode=m;$("loginTab").classList.toggle("active",m==="login");$("signupTab").classList.toggle("active",m==="signup");$("submit").textContent=m==="login"?"Giriş Yap":"Hesap Oluştur";$("hint").textContent=m==="login"?"Başvurunuz admin tarafından onaylandıysa hesabınız mağazanıza bağlanır.":"Başvuruda kullandığınız e-posta ile hesap oluşturun. Onaylı üretici kaydınız otomatik bağlanacaktır."}
$("loginTab").onclick=()=>setMode("login");$("signupTab").onclick=()=>setMode("signup");
function show(text,ok=false){msg.textContent=text;msg.className="msg "+(ok?"ok":"err");msg.style.display="block"}
async function claim(){const r=await db.rpc("claim_producer_account");if(r.error)throw r.error;if(r.data===true)return true;return false}
async function go(){location.href="uretici-panel.html"}
$("form").onsubmit=async e=>{e.preventDefault();msg.style.display="none";$("submit").disabled=true;try{const email=$("email").value.trim(),password=$("password").value;
if(mode==="signup"){const r=await db.auth.signUp({email,password});if(r.error)throw r.error;if(!r.data.session){show("Hesabınız oluşturuldu. E-posta doğrulamasını tamamladıktan sonra Giriş Yap sekmesinden giriş yapın.",true);return}}
else{const r=await db.auth.signInWithPassword({email,password});if(r.error)throw r.error}
const linked=await claim();if(linked){show("Üretici hesabınız mağazanıza bağlandı. Yönlendiriliyorsunuz…",true);setTimeout(go,700)}else{show("Giriş başarılı ancak bu e-posta ile onaylı ve eşleşmemiş bir üretici kaydı bulunamadı.");await db.auth.signOut()}
}catch(x){show(x.message||"İşlem başarısız.")}finally{$("submit").disabled=false}};
</script></body></html>
