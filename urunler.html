<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tüm Ürünler | Üreticiden Halka</title><link rel="stylesheet" href="site-polish.css"><style>.wrap{width:min(1180px,calc(100% - 28px));margin:auto}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:#fff;border:1px solid #dfe7df;border-radius:18px;overflow:hidden}.pic{height:220px;background:#eef4ec;display:grid;place-items:center;font-size:55px;overflow:hidden;position:relative}.pic img{width:100%;height:100%;object-fit:cover}.body{padding:14px}.name{font-size:15px;font-weight:950;margin:5px 0}.cat,.producer,.stock{font-size:10px;color:#718078}.price{font-size:18px;font-weight:950;margin-top:10px}.buy{border:0;background:#166534;color:#fff;border-radius:9px;padding:9px 10px;font-weight:950;cursor:pointer}.foot{display:flex;justify-content:space-between;align-items:end;margin-top:10px}.empty{grid-column:1/-1;text-align:center;padding:55px;background:#fff;border:1px dashed #cfd8d0;border-radius:18px;color:#718078}@media(max-width:950px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid{grid-template-columns:1fr}.pic{height:240px}}</style></head><body><header><div class="wrap" style="min-height:72px;display:flex;align-items:center"><a href="index.html"><img src="logo (1).png" alt="Üreticiden Halka" style="width:180px;max-height:54px;object-fit:contain"></a><a href="sepet.html" style="margin-left:auto;color:#166534;font-weight:900">🛒 Sepet</a></div></header><section style="padding:34px 0;background:linear-gradient(135deg,#eaf5e8,#fff)"><div class="wrap"><h1>Tüm Ürünler</h1><div style="color:#718078;font-size:12px">Aktif üreticilerin güncel ürünlerini keşfet.</div></div></section><main class="wrap"><div style="display:grid;grid-template-columns:1fr 190px 150px;gap:9px;margin:20px 0"><input id="search" placeholder="Ürün veya üretici ara..." style="padding:12px;border:1px solid #d7e0d7;border-radius:11px"><select id="category"><option value="all">Tüm kategoriler</option></select><select id="sort"><option value="new">Yeniler</option><option value="low">Fiyat: düşük</option><option value="high">Fiyat: yüksek</option></select></div><div id="grid" class="grid"><div class="empty">Ürünler yükleniyor...</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient('https://bzudwfyxgbkzvfjhhywy.supabase.co','sb_publishable_a_gZqrURzUqY14KGJXbxxw_AgBbOxRu');const $=id=>document.getElementById(id);let products=[],producerMap={};function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function titleTR(v){return String(v??'').trim().toLocaleLowerCase('tr-TR').replace(/(^|[\s/-])([a-zçğıöşü])/gu,(m,s,c)=>s+c.toLocaleUpperCase('tr-TR'))}function money(v){return Number(v||0).toLocaleString('tr-TR',{minimumFractionDigits:2})+' ₺'}async function load(){const r=await db.from('urunler').select('id,uretici_id,urun_adi,aciklama,kategori,fiyat,stok,gorsel_url,aktif,created_at').eq('aktif',true).order('created_at',{ascending:false});if(r.error){$('grid').innerHTML='<div class="empty">Ürünler yüklenemedi.</div>';return}products=r.data||[];const ids=[...new Set(products.map(p=>p.uretici_id).filter(Boolean))];if(ids.length){const pr=await db.from('ureticiler_public').select('id,firma_adi,durum').in('id',ids).eq('durum','Aktif');if(pr.error){$('grid').innerHTML='<div class="empty">Üretici bilgileri şu anda yüklenemiyor.</div>';return}(pr.data||[]).forEach(p=>producerMap[String(p.id)]=p.firma_adi||'Yerel üretici')}const cats=[...new Set(products.map(x=>x.kategori).filter(Boolean))];$('category').innerHTML='<option value="all">Tüm kategoriler</option>'+cats.map(x=>'<option value="'+esc(x)+'">'+esc(titleTR(x))+'</option>').join('');render()}function render(){const q=$('search').value.trim().toLocaleLowerCase('tr-TR'),cat=$('category').value,sort=$('sort').value;let list=products.filter(p=>(!q||[p.urun_adi,p.kategori,producerMap[String(p.uretici_id)]||'',p.aciklama].join(' ').toLocaleLowerCase('tr-TR').includes(q))&&(cat==='all'||p.kategori===cat));if(sort==='low')list.sort((a,b)=>Number(a.fiyat)-Number(b.fiyat));if(sort==='high')list.sort((a,b)=>Number(b.fiyat)-Number(a.fiyat));if(!list.length){$('grid').innerHTML='<div class="empty">Aradığınız ürünü bulamadık.</div>';return}$('grid').innerHTML=list.map(p=>{const name=titleTR(p.urun_adi),producer=producerMap[String(p.uretici_id)]||'Yerel üretici';return '<article class="card"><a href="urun.html?id='+encodeURIComponent(p.id)+'"><div class="pic">'+(p.gorsel_url?'<img src="'+esc(p.gorsel_url)+'" alt="'+esc(name)+'">':'🧺')+'</div><div class="body"><div class="cat">'+esc(titleTR(p.kategori||'Ürün'))+'</div><div class="name">'+esc(name)+'</div><div class="producer">'+esc(producer)+'</div><div class="foot"><div><div class="price">'+money(p.fiyat)+'</div><div class="stock">'+(p.stok>0?'✓ Stokta':'Stok tükendi')+'</div></div></div></div></a></article>'}).join('')}$('search').oninput=render;$('category').onchange=render;$('sort').onchange=render;load();</script></body></html>
