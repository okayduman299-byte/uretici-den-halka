<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tüm Ürünler | Üreticiden Halka</title>
<style>
:root{--g:#166534;--bg:#f5f8f4;--ink:#17211b;--muted:#718078;--line:#dfe7df}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}a{text-decoration:none;color:inherit}.wrap{width:min(1180px,calc(100% - 28px));margin:auto}header{position:sticky;top:0;z-index:20;background:#ffffffee;border-bottom:1px solid var(--line)}.nav{min-height:72px;display:flex;align-items:center;gap:18px}.logo img{width:180px;max-height:54px;object-fit:contain}.back{margin-left:auto;color:var(--g);font-size:12px;font-weight:900}.hero{padding:34px 0;background:linear-gradient(135deg,#eaf5e8,#fff)}h1{margin:0 0 7px;font-size:34px}.muted{color:var(--muted);font-size:12px;line-height:1.6}.tools{display:grid;grid-template-columns:1fr 190px 150px;gap:9px;margin:20px 0}.tools input,.tools select{width:100%;padding:12px;border:1px solid #d7e0d7;border-radius:11px;background:#fff;font:inherit;outline:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;padding-bottom:60px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:0 12px 28px #18351f12}.pic{height:220px;background:linear-gradient(145deg,#eef4ec,#e1eae0);display:grid;place-items:center;font-size:55px;overflow:hidden;position:relative}.pic img{width:100%;height:100%;object-fit:cover}.tag{position:absolute;left:10px;top:10px;background:#fff;color:var(--g);padding:6px 8px;border-radius:99px;font-size:8px;font-weight:950}.body{padding:14px}.cat{font-size:9px;color:#77847c;font-weight:800}.name{font-size:15px;font-weight:950;margin:5px 0}.producer{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.foot{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-top:12px}.price{font-size:18px;font-weight:950}.stock{font-size:9px;color:var(--g);font-weight:800;margin-top:3px}.buy{border:0;background:var(--g);color:#fff;border-radius:9px;padding:9px 10px;font-size:9px;font-weight:950;cursor:pointer}.empty{grid-column:1/-1;text-align:center;background:#fff;border:1px dashed #cfd8d0;border-radius:18px;padding:55px;color:var(--muted)}.toast{position:fixed;right:18px;bottom:18px;background:#102219;color:#fff;padding:13px 16px;border-radius:12px;font-size:11px;font-weight:800;opacity:0;transform:translateY(15px);transition:.2s}.toast.show{opacity:1;transform:none}@media(max-width:950px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.tools{grid-template-columns:1fr 1fr}.tools input{grid-column:1/-1}}@media(max-width:500px){.grid{grid-template-columns:1fr}.pic{height:240px}.tools{grid-template-columns:1fr}.tools input{grid-column:auto}.logo img{width:160px}}
</style>
<link rel="stylesheet" href="site-polish.css">
</head>
<body>
<header><div class="wrap nav"><a class="logo" href="index.html"><img src="logo (1).png" alt="Üreticiden Halka"></a><a class="back" href="sepet.html">🛒 Sepet</a></div></header>
<section class="hero"><div class="wrap"><h1>Tüm Ürünler</h1><div class="muted">Aktif üreticilerin güncel ürünlerini keşfet.</div></div></section>
<main class="wrap"><div class="tools"><input id="search" placeholder="Ürün veya üretici ara..."><select id="category"><option value="all">Tüm kategoriler</option></select><select id="sort"><option value="new">Yeniler</option><option value="low">Fiyat: düşük</option><option value="high">Fiyat: yüksek</option></select></div><div id="grid" class="grid"><div class="empty">Ürünler yükleniyor...</div></div></main><div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient('https://bzudwfyxgbkzvfjhhywy.supabase.co','sb_publishable_a_gZqrURzUqY14KGJXbxxw_AgBbOxRu');const $=id=>document.getElementById(id);let products=[];
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function money(v){return Number(v||0).toLocaleString('tr-TR',{minimumFractionDigits:2})+' ₺'}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').classList.remove('show'),2000)}function cart(){try{return JSON.parse(localStorage.getItem('uh_cart')||'[]')}catch{return[]}}
function add(p){let c=cart(),x=c.find(i=>Number(i.id)===Number(p.id));if(x){if(x.qty>=p.stok)return toast('Stok sınırına ulaştınız.');x.qty++}else c.push({id:p.id,name:p.urun_adi,category:p.kategori||'',price:Number(p.fiyat||0),stock:Number(p.stok||0),image:p.gorsel_url||'',producer_id:p.uretici_id||null,qty:1});localStorage.setItem('uh_cart',JSON.stringify(c));toast('Ürün sepete eklendi ✓')}
async function load(){const r=await db.from('urunler').select('id,uretici_id,urun_adi,aciklama,kategori,fiyat,stok,gorsel_url,aktif,created_at,ureticiler!inner(firma_adi,durum)').eq('aktif',true).eq('ureticiler.durum','Aktif').order('created_at',{ascending:false});if(r.error){$('grid').innerHTML='<div class="empty">Ürünler yüklenemedi.</div>';return}products=r.data||[];const cats=[...new Set(products.map(x=>x.kategori).filter(Boolean))];$('category').innerHTML='<option value="all">Tüm kategoriler</option>'+cats.map(x=>'<option>'+esc(x)+'</option>').join('');render()}
function render(){const q=$('search').value.trim().toLocaleLowerCase('tr-TR'),cat=$('category').value,sort=$('sort').value;let list=products.filter(p=>(!q||[p.urun_adi,p.kategori,p.ureticiler?.firma_adi,p.aciklama].join(' ').toLocaleLowerCase('tr-TR').includes(q))&&(cat==='all'||p.kategori===cat));if(sort==='low')list.sort((a,b)=>Number(a.fiyat)-Number(b.fiyat));if(sort==='high')list.sort((a,b)=>Number(b.fiyat)-Number(a.fiyat));if(!list.length){$('grid').innerHTML='<div class="empty">Aradığınız ürünü bulamadık.</div>';return}$('grid').innerHTML=list.map(p=>`<article class="card"><a href="urun.html?id=${encodeURIComponent(p.id)}"><div class="pic">${p.gorsel_url?`<img src="${esc(p.gorsel_url)}" alt="${esc(p.urun_adi)}">`:'🧺'}<span class="tag">ÜRETİCİDEN</span></div></a><div class="body"><div class="cat">${esc(p.kategori||'Ürün')}</div><div class="name">${esc(p.urun_adi)}</div><div class="producer">${esc(p.ureticiler?.firma_adi||'Yerel üretici')}</div><div class="foot"><div><div class="price">${money(p.fiyat)}</div><div class="stock">${p.stok>0?'✓ Stokta':'Stok tükendi'}</div></div><button class="buy" ${p.stok<1?'disabled':''} onclick="event.preventDefault();add(${JSON.stringify(p).replace(/"/g,'&quot;')})">Sepete Ekle</button></div></div></article>`).join('')}
$('search').oninput=render;$('category').onchange=render;$('sort').onchange=render;load();
</script></body></html>
