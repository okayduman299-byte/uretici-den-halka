<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sipariş Takip | Üreticiden Halka</title>
<style>
:root{--g:#14532d;--g2:#166534;--ink:#17211b;--muted:#718078;--soft:#f5f8f4;--line:#e1e8e1}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--soft);color:var(--ink)}
.container{width:min(900px,calc(100% - 30px));margin:auto}header{background:#fff;border-bottom:1px solid var(--line)}
.nav{min-height:74px;display:flex;align-items:center}.logo img{width:190px;max-height:55px;object-fit:contain;display:block}.back{margin-left:auto;color:var(--g2);font-size:13px;font-weight:900;text-decoration:none}
.page{padding:42px 0 65px}.hero{text-align:center;margin-bottom:23px}.hero h1{font-size:34px;margin:0 0 8px;letter-spacing:-1px}.muted{color:var(--muted);font-size:13px;line-height:1.6}
.search{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;gap:9px;box-shadow:0 8px 28px #18351f08}.search input{flex:1;border:1px solid #d7e0d7;border-radius:11px;padding:13px;font-size:14px;outline:0}.search input:focus{border-color:#8db59a}.btn{border:0;border-radius:11px;background:var(--g2);color:#fff;padding:0 20px;font-weight:950;cursor:pointer}.btn:disabled{opacity:.55}
.err{display:none;margin-top:10px;background:#fff0f0;color:#991b1b;padding:12px;border-radius:10px;font-size:12px}
.result{display:none;margin-top:18px}.card{background:#fff;border:1px solid var(--line);border-radius:21px;padding:23px;box-shadow:0 9px 30px #18351f09}
.head{display:flex;justify-content:space-between;gap:12px;align-items:start;border-bottom:1px solid #edf1ed;padding-bottom:17px}.orderNo{font-size:21px;font-weight:950}.date{color:var(--muted);font-size:11px;margin-top:5px}.badge{padding:8px 11px;border-radius:999px;background:#e8f1ff;color:#245ca6;font-size:10px;font-weight:950}
.progress{margin:25px 0}.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.bar{height:7px;border-radius:99px;background:#e1e7e1}.bar.on{background:var(--g2)}.labels{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px;font-size:10px;color:var(--muted)}.labels b{color:var(--ink)}
.section{border-top:1px solid #edf1ed;padding-top:18px;margin-top:18px}.section h3{font-size:14px;margin:0 0 11px}.item{display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid #edf1ed;font-size:12px}.item:last-child{border-bottom:0}.item span{color:#5f6d64}.total{display:flex;justify-content:space-between;font-size:18px;font-weight:950;padding-top:14px}
.payment{display:grid;gap:8px;background:#f7faf6;border:1px solid var(--line);border-radius:12px;padding:13px;font-size:12px}.payment div{display:flex;justify-content:space-between;gap:12px}.payment span{color:var(--muted)}.pending{color:#9a6b00!important}.paid{color:var(--g2)!important}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.action{display:inline-flex;align-items:center;justify-content:center;min-height:43px;padding:0 15px;border-radius:10px;background:#edf3ed;color:var(--g2);font-size:11px;font-weight:950;text-decoration:none}.action.primary{background:var(--g2);color:#fff}
.empty{text-align:center;padding:30px;color:var(--muted)}
@media(max-width:600px){.hero h1{font-size:29px}.search{flex-direction:column}.btn{height:46px}.head{display:block}.badge{display:inline-block;margin-top:10px}.labels{font-size:9px}.card{padding:17px}}
</style>
<link rel="stylesheet" href="site-polish.css">
</head>
<body>
<header><div class="container nav"><a class="logo" href="index.html"><img src="logo (1).png" alt="Üreticiden Halka"></a><a class="back" href="index.html">← Alışverişe dön</a></div></header>
<main class="container page">
<div class="hero"><h1>Siparişini Takip Et</h1><div class="muted">Sipariş numaranı girerek siparişinin güncel durumunu görüntüle.</div></div>
<div class="search"><input id="no" placeholder="Örn. UH-20260816-00010"><button id="btn" class="btn">Siparişi Bul</button></div>
<div id="err" class="err"></div><div id="result" class="result"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=window.supabase.createClient("https://bzudwfyxgbkzvfjhhywy.supabase.co","sb_publishable_a_gZqrURzUqY14KGJXbxxw_AgBbOxRu");
const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":">","\"":"&quot;","'":"&#039;"}[m]))}
function money(v){return Number(v||0).toLocaleString("tr-TR",{minimumFractionDigits:2})+" ₺"}
function error(t){$("err").textContent=t;$("err").style.display="block"}
async function find(){
 $("err").style.display="none";$("result").style.display="none";
 const no=$("no").value.trim();if(!no){error("Sipariş numaranı gir.");return}
 $("btn").disabled=true;$("btn").textContent="Aranıyor...";
 try{
  const r=await db.from("siparisler").select("id,siparis_no,durum,created_at,toplam,musteri_adi,odeme_yontemi,odeme_durumu").eq("siparis_no",no).maybeSingle();
  if(r.error)throw r.error;if(!r.data){error("Bu sipariş numarasıyla kayıt bulunamadı.");return}
  const ir=await db.from("siparis_urunleri").select("urun_adi,adet,ara_toplam").eq("siparis_id",r.data.id);
  if(ir.error)throw ir.error;render(r.data,ir.data||[]);
 }catch(e){error(e.message||"Sipariş bulunamadı.")}finally{$("btn").disabled=false;$("btn").textContent="Siparişi Bul"}
}
function render(o,items){
 const states=["Yeni","Hazırlanıyor","Kargoda","Tamamlandı"];
 let idx=states.indexOf(o.durum);if(idx<0&&o.durum==="Teslim Edildi")idx=3;
 if(o.durum==="İptal")idx=-1;
 const bars=states.map((x,i)=>'<div class="bar '+(idx>=i?"on":"")+'"></div>').join("");
 const labels=states.map((x,i)=>'<div>'+((idx>=i)?"✓ ":"")+'<b>'+x+'</b></div>').join("");
 const eft=o.odeme_yontemi==="havale";
 const pay=eft?"Havale / EFT":o.odeme_yontemi==="kart"?"Online Kart":"Kapıda Ödeme";
 const payStatus=o.odeme_durumu||"Bekliyor";
 $("result").innerHTML='<div class="card"><div class="head"><div><div class="orderNo">'+esc(o.siparis_no)+'</div><div class="date">'+new Date(o.created_at).toLocaleString("tr-TR")+'</div></div><span class="badge">'+esc(o.durum)+'</span></div>'+
 '<div class="progress"><div class="bars">'+bars+'</div><div class="labels">'+labels+'</div></div>'+
 '<div class="section"><h3>Sipariş ürünleri</h3>'+ (items.length?items.map(x=>'<div class="item"><span>'+esc(x.urun_adi)+' × '+esc(x.adet)+'</span><b>'+money(x.ara_toplam)+'</b></div>').join(""):'<div class="empty">Ürün bilgisi bulunamadı.</div>')+
 '<div class="total"><span>Toplam</span><span>'+money(o.toplam)+'</span></div></div>'+
 '<div class="section"><h3>Ödeme bilgileri</h3><div class="payment"><div><span>Ödeme yöntemi</span><b>'+pay+'</b></div><div><span>Ödeme durumu</span><b class="'+(payStatus==="Ödendi"?"paid":"pending")+'">'+esc(payStatus)+'</b></div></div></div>'+
 '<div class="actions">'+(eft?'<a class="action primary" href="havale-bildirim.html?no='+encodeURIComponent(o.siparis_no)+'">Havale / EFT Bildirimi</a>':"")+'<a class="action" href="index.html">Alışverişe Devam Et</a></div></div>';
 $("result").style.display="block";
}
$("btn").onclick=find;$("no").addEventListener("keydown",e=>{if(e.key==="Enter")find()});
const urlNo=new URLSearchParams(location.search).get("no");if(urlNo){$("no").value=urlNo;find()}
</script>
</body>
</html>
