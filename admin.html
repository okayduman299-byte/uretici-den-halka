<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yönetim Paneli</title>
<style>
body{font-family:Arial;margin:0;background:#f5f8f4;color:#17211b}.container{width:min(1150px,calc(100% - 30px));margin:auto}header{background:#fff;border-bottom:1px solid #e1e7e1;padding:20px 0}.logo{font-size:20px;font-weight:800;color:#166534}.logo span{color:#17211b}.page{padding:30px 0}.card{background:#fff;border:1px solid #e1e7e1;border-radius:18px;padding:20px}.login{max-width:420px;margin:60px auto}input,select{width:100%;padding:12px;margin:7px 0;border:1px solid #dce3dc;border-radius:10px;box-sizing:border-box}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer}.green{background:#166534;color:#fff}.red{background:#fee2e2;color:#991b1b}.error{display:none;background:#fee2e2;color:#991b1b;padding:10px;border-radius:9px;margin-top:10px}.toolbar{display:flex;gap:10px;margin-bottom:15px}.toolbar input{flex:1}.tablewrap{overflow:auto}.table{width:100%;min-width:900px;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid #edf1ed;text-align:left;font-size:13px}.badge{padding:5px 9px;border-radius:20px;background:#fff7d6;color:#876900;font-size:11px;font-weight:800}.approved{background:#e5f6e7;color:#166534}
</style></head><body>
<header><div class="container"><span class="logo">Üreticiden <span>Halka</span></span></div></header>
<main class="page"><div class="container">
<section id="login" class="login card"><h1>Yönetim Paneli</h1><input id="email" type="email" placeholder="Yönetici e-postası"><input id="pass" type="password" placeholder="Şifre"><button id="loginBtn" class="btn green" style="width:100%">Giriş Yap</button><div id="loginErr" class="error"></div></section>
<section id="panel" style="display:none"><div style="display:flex;justify-content:space-between;align-items:center"><h1>Üretici Başvuruları</h1><button id="refresh" class="btn green">↻ Yenile</button></div>
<div class="card"><div class="toolbar"><input id="search" placeholder="Ara..."><select id="filter"><option value="all">Tümü</option><option>Beklemede</option><option>Onaylandı</option><option>Reddedildi</option></select></div>
<div class="tablewrap"><table class="table"><thead><tr><th>Üretici</th><th>Yetkili</th><th>İletişim</th><th>Konum</th><th>Kategori</th><th>Durum</th><th>İşlem</th></tr></thead><tbody id="rows"></tbody></table></div></div></section>

<section id="ordersSection" style="margin-top:28px">
  <h2>📦 Sipariş Yönetimi</h2>
  <div class="card">
    <div class="toolbar">
      <input id="orderSearch" placeholder="Sipariş no, müşteri veya telefon ara...">
      <select id="orderFilter">
        <option value="all">Tüm durumlar</option>
        <option>Yeni</option>
        <option>Hazırlanıyor</option>
        <option>Kargoda</option>
        <option>Tamamlandı</option>
        <option>İptal</option>
      </select>
    </div>
    <div id="ordersAdmin"></div>
    <div id="ordersEmpty" style="display:none;text-align:center;padding:30px;color:#718078">Henüz sipariş bulunmuyor.</div>
  </div>
</section>

</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=window.supabase.createClient("https://bzudwfyxgbkzvfjhhywy.supabase.co","sb_publishable_a_gZqrURzUqY14KGJXbxxw_AgBbOxRu");
let applications=[];
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function err(m){$("loginErr").textContent=m;$("loginErr").style.display="block"}
async function login(){
 const email=$("email").value.trim(),password=$("pass").value;
 if(!email||!password)return err("E-posta ve şifreyi girin.");
 $("loginBtn").disabled=true;$("loginBtn").textContent="Giriş yapılıyor...";
 try{
  const r=await db.auth.signInWithPassword({email,password});if(r.error)throw r.error;
  const a=await db.rpc("is_admin");if(a.error)throw a.error;if(a.data!==true)throw new Error("Bu hesap admin değil.");
  $("login").style.display="none";$("panel").style.display="block";await load();
 }catch(e){err(e.message||"Giriş başarısız");$("loginBtn").disabled=false;$("loginBtn").textContent="Giriş Yap"}
}
async function load(){
 const r=await db.from("uretici_basvurulari").select("*").order("id",{ascending:false});
 if(r.error){alert("Başvurular yüklenemedi: "+r.error.message);return}
 applications=r.data||[];render();await loadAdminOrders();
}
function render(){
 const q=$("search").value.toLocaleLowerCase("tr-TR"),f=$("filter").value;
 const list=applications.filter(x=>(f==="all"||x.durum===f)&&(!q||Object.values(x).join(" ").toLocaleLowerCase("tr-TR").includes(q)));
 $("rows").innerHTML=list.map(x=>{
 const action=x.durum==="Onaylandı"
   ? '<span class="badge approved">✓ Onaylandı</span>'
   : x.durum==="Reddedildi"
     ? '<span class="badge" style="background:#fee2e2;color:#991b1b">✕ Reddedildi</span>'
     : `<button class="btn green approveBtn" data-id="${x.id}">Onayla</button> <button class="btn red rejectBtn" data-id="${x.id}">Reddet</button>`;
 return `<tr><td><b>${esc(x.uretici_adi)}</b><br>#${x.id}</td><td>${esc(x.yetkili)}</td><td>${esc(x.telefon)}<br>${esc(x.email)}</td><td>${esc(x.il)} / ${esc(x.ilce)}</td><td>${esc(x.kategori)}</td><td><span class="badge ${x.durum==="Onaylandı"?"approved":""}">${esc(x.durum)}</span></td><td>${action}</td></tr>`;
}).join("");
}
async function updateApplicationStatus(id,newStatus){
 const btn=[...document.querySelectorAll("[data-id]")].find(b=>b.dataset.id===String(id));
 if(btn){btn.disabled=true;btn.textContent="İşleniyor..."}
 const r=await db.from("uretici_basvurulari").update({durum:newStatus}).eq("id",id).select("id,durum");
 if(r.error){alert("Onaylama başarısız: "+r.error.message);if(btn){btn.disabled=false;btn.textContent="Onayla"};return}
 if(!r.data||!r.data.length){alert("Güncelleme yapılmadı. RLS yetkisini kontrol et.");return}
 alert("Başvuru "+newStatus+" olarak güncellendi.");
 await load();
}
$("loginBtn").onclick=login;$("refresh").onclick=load;$("search").oninput=render;$("filter").onchange=render;
$("rows").addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 const id=Number(b.dataset.id);
 if(b.classList.contains("approveBtn"))updateApplicationStatus(id,"Onaylandı");
 if(b.classList.contains("rejectBtn"))updateApplicationStatus(id,"Reddedildi");
});

let adminOrders=[];

async function loadAdminOrders(){
 const r=await db.from("siparisler")
   .select("id,siparis_no,musteri_adi,musteri_telefon,musteri_email,teslimat_adresi,toplam,durum,created_at")
   .order("created_at",{ascending:false});
 if(r.error){alert("Siparişler yüklenemedi: "+r.error.message);return}
 adminOrders=r.data||[];
 renderAdminOrders();
}

async function loadOrderItems(orderId){
 const r=await db.from("siparis_urunleri")
   .select("urun_adi,uretici_id,fiyat,adet,ara_toplam")
   .eq("siparis_id",orderId);
 if(r.error) return [];
 return r.data||[];
}

async function renderAdminOrders(){
 const q=$("orderSearch").value.trim().toLocaleLowerCase("tr-TR");
 const f=$("orderFilter").value;
 const list=adminOrders.filter(o=>
   (f==="all"||o.durum===f) &&
   (!q || [o.siparis_no,o.musteri_adi,o.musteri_telefon].join(" ").toLocaleLowerCase("tr-TR").includes(q))
 );
 const box=$("ordersAdmin");
 box.innerHTML="";
 $("ordersEmpty").style.display=list.length?"none":"block";

 for(const o of list){
   const items=await loadOrderItems(o.id);
   const el=document.createElement("div");
   el.className="card";
   el.style.marginBottom="14px";
   el.innerHTML=`
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap">
      <div><b>${esc(o.siparis_no)}</b><div class="muted">${new Date(o.created_at).toLocaleString("tr-TR")}</div></div>
      <span class="badge ${o.durum==="Tamamlandı"?"approved":""}">${esc(o.durum)}</span>
    </div>
    <div style="margin:12px 0;padding:12px;background:#f7faf7;border-radius:10px">
      <b>${esc(o.musteri_adi)}</b> • ${esc(o.musteri_telefon)}
      ${o.musteri_email?"<br>"+esc(o.musteri_email):""}
      <br><b>Adres:</b> ${esc(o.teslimat_adresi)}
    </div>
    ${items.map(x=>`<div style="display:flex;justify-content:space-between;border-top:1px solid #edf0ed;padding:9px 0">
      <span>${esc(x.urun_adi)} × ${x.adet}</span>
      <b>${Number(x.ara_toplam||0).toLocaleString("tr-TR",{minimumFractionDigits:2})} ₺</b>
    </div>`).join("")}
    <div style="display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid #e1e7e1">
      <b>Toplam</b><b>${Number(o.toplam||0).toLocaleString("tr-TR",{minimumFractionDigits:2})} ₺</b>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">
      ${["Yeni","Hazırlanıyor","Kargoda","Tamamlandı","İptal"].map(s=>`<button class="btn ${o.durum===s?"green":s==="İptal"?"red":""}" onclick="setAdminOrderStatus(${o.id},'${s}')">${s}</button>`).join("")}
    </div>`;
   box.appendChild(el);
 }
}

async function setAdminOrderStatus(id,status){
 const r=await db.from("siparisler").update({durum:status}).eq("id",id).select("id,durum");
 if(r.error){alert("Durum güncellenemedi: "+r.error.message);return}
 if(!r.data?.length){alert("Sipariş güncellenemedi.");return}
 await loadAdminOrders();
}

$("orderSearch").addEventListener("input",renderAdminOrders);
$("orderFilter").addEventListener("change",renderAdminOrders);
</script></body></html>
