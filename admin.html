<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yönetim Paneli | Üreticiden Halka</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f8f4;color:#17211b}.container{width:min(1200px,calc(100% - 28px));margin:auto}header{height:72px;background:#fff;border-bottom:1px solid #e2e8e2;display:flex;align-items:center}.top{display:flex;justify-content:space-between}.logo{font-size:20px;font-weight:800;color:#166534;text-decoration:none}.logo span{color:#17211b}.page{padding:28px 0}.card{background:#fff;border:1px solid #e0e7e0;border-radius:18px;padding:20px;box-shadow:0 8px 30px #1932200d}h1{margin:0 0 6px}.muted{color:#718078;font-size:13px}.login{max-width:430px;margin:70px auto}.login input{display:block;width:100%;padding:12px;margin:8px 0;border:1px solid #d9e2da;border-radius:10px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.green{background:#166534;color:#fff}.light{background:#eef3ee}.login .btn{width:100%;margin-top:6px}.error{display:none;background:#fee2e2;color:#991b1b;padding:11px;border-radius:9px;margin-top:12px;font-size:13px}.title{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}.stat{background:#fff;border:1px solid #e0e7e0;border-radius:15px;padding:16px}.stat b{display:block;font-size:28px;margin-top:5px}.toolbar{display:flex;gap:10px;margin-bottom:15px}.toolbar input,.toolbar select{padding:11px;border:1px solid #d9e2da;border-radius:10px}.toolbar input{flex:1}.tablewrap{overflow:auto}.table{width:100%;min-width:950px;border-collapse:collapse}.table th,.table td{padding:12px 9px;border-bottom:1px solid #edf1ed;text-align:left;font-size:13px}.table th{font-size:11px;color:#718078}.badge{padding:5px 9px;border-radius:20px;font-size:11px;font-weight:800}.pending{background:#fff7d6;color:#8a6200}.approved{background:#e5f6e7;color:#166534}.rejected{background:#fee8e8;color:#991b1b}.actions{display:flex;gap:5px}.actions button{border:0;border-radius:8px;padding:7px;font-weight:800;cursor:pointer}.approve{background:#dcf4df;color:#166534}.reject{background:#fee2e2;color:#991b1b}.empty{text-align:center;padding:35px;color:#718078}@media(max-width:700px){.stats{grid-template-columns:1fr}.title{display:block}.toolbar{flex-direction:column}}
</style></head><body><header><div class="container top"><a class="logo" href="index.html">Üreticiden <span>Halka</span></a><button id="logout" class="btn light" style="display:none">Çıkış Yap</button></div></header><main class="page"><div class="container">
<section id="login" class="login card"><h1>Yönetim Paneli</h1><div class="muted">Supabase yönetici hesabınızla giriş yapın.</div><input id="email" type="email" placeholder="Yönetici e-postası"><input id="pass" type="password" placeholder="Şifre"><button id="loginBtn" class="btn green">Giriş Yap</button><div id="loginErr" class="error"></div></section>
<section id="panel" style="display:none"><div class="title"><div><h1>Üretici Başvuruları</h1><div class="muted">Başvuruları incele, onayla veya reddet.</div></div><button id="refresh" class="btn green">↻ Yenile</button></div>
<div class="stats"><div class="stat">Toplam<b id="total">0</b></div><div class="stat">Beklemede<b id="pending">0</b></div><div class="stat">Onaylanan<b id="approved">0</b></div></div>
<div class="card"><div class="toolbar"><input id="search" placeholder="Üretici, yetkili, telefon, ilçe ara..."><select id="filter"><option value="all">Tümü</option><option>Beklemede</option><option>Onaylandı</option><option>Reddedildi</option></select></div><div class="tablewrap"><table class="table"><thead><tr><th>Üretici</th><th>Yetkili</th><th>İletişim</th><th>Konum</th><th>Kategori</th><th>Açıklama</th><th>Durum</th><th>İşlem</th></tr></thead><tbody id="rows"></tbody></table></div><div id="empty" class="empty" style="display:none">Başvuru bulunamadı.</div></div></section>
</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL = "https://bzudwfyxgbkzvfjhhywy.supabase.co";
const SUPABASE_KEY = "sb_publishable_a_gZqrURzUqY14KGJXbxxw_AgBbOxRu";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
const $=id=>document.getElementById(id);function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
async function load(){let r=await db.from("uretici_basvurulari").select("*").order("id",{ascending:false});if(r.error)return alert(r.error.message);data=r.data||[];render()}
function render(){let q=$("search").value.toLocaleLowerCase("tr-TR"),f=$("filter").value;let a=data.filter(x=>(f==="all"||x.durum===f)&&(!q||Object.values(x).join(" ").toLocaleLowerCase("tr-TR").includes(q)));$("total").textContent=data.length;$("pending").textContent=data.filter(x=>x.durum==="Beklemede").length;$("approved").textContent=data.filter(x=>x.durum==="Onaylandı").length;$("empty").style.display=a.length?"none":"block";$("rows").innerHTML=a.map(x=>{let c=x.durum==="Onaylandı"?"approved":x.durum==="Reddedildi"?"rejected":"pending";return `<tr><td><b>${esc(x.uretici_adi)}</b><br>#${esc(x.id)}</td><td>${esc(x.yetkili)}</td><td>${esc(x.telefon)}<br>${esc(x.email)}</td><td>${esc(x.il)} / ${esc(x.ilce)}</td><td>${esc(x.kategori)}</td><td>${esc(x.aciklama)}</td><td><span class="badge ${c}">${esc(x.durum)}</span></td><td><div class="actions"><button class="approve" onclick="status(${x.id},'Onaylandı')">Onayla</button><button class="reject" onclick="status(${x.id},'Reddedildi')">Reddet</button></div></td></tr>`}).join("")}
async function status(id,s){let r=await db.from("uretici_basvurulari").update({durum:s}).eq("id",id);if(r.error)return alert(r.error.message);load()}
$("loginBtn").onclick=async()=>{let r=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("pass").value});if(r.error){$("loginErr").textContent="Giriş başarısız: "+r.error.message;$("loginErr").style.display="block";return}show()};
async function show(){ $("login").style.display="none";$("panel").style.display="block";$("logout").style.display="block";load()}$("logout").onclick=async()=>{await db.auth.signOut();location.reload()};$("refresh").onclick=load;$("search").oninput=render;$("filter").onchange=render;
db.auth.getSession().then(r=>r.data.session?show():null);
</script></body></html>
