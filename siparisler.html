<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Siparişler | Yönetim</title>
<style>body{font-family:Arial;margin:0;background:#f5f8f4;color:#17211b}.wrap{width:min(1150px,calc(100% - 30px));margin:auto}header{background:#fff;padding:22px 0;border-bottom:1px solid #e1e7e1}h1{margin:30px 0}.bar{display:flex;gap:10px;align-items:center;margin-bottom:15px}.box{background:#fff;border:1px solid #e1e7e1;border-radius:18px;padding:18px}.order{border:1px solid #e2e8e2;border-radius:14px;padding:16px;margin:12px 0}.top{display:flex;justify-content:space-between;gap:10px}.badge{background:#eaf5ea;color:#166534;border-radius:20px;padding:6px 10px;font-size:12px;font-weight:700}.items{font-size:13px;color:#5f6d64;line-height:1.7;margin-top:10px}.actions{margin-top:12px}.actions button{border:0;border-radius:9px;padding:9px 12px;margin-right:5px;cursor:pointer}.ok{background:#166534;color:#fff}.warn{background:#fef3c7}.cancel{background:#fee2e2;color:#991b1b}.muted{color:#718078;font-size:12px}@media(max-width:700px){.top{display:block}}</style></head>
<body><header><div class="wrap"><b style="font-size:20px;color:#166534">Üreticiden <span style="color:#17211b">Halka</span></b></div></header>
<main class="wrap"><h1>Siparişler</h1><div id="box" class="box">Yükleniyor...</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient("https://bzudwfyxgbkzvfjhhywy.supabase.co","sb_publishable_a_gZqrURzUqY14KGJXbxxw_AgBbOxRu"),box=document.getElementById("box");
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function load(){const s=await db.auth.getSession();if(!s.data.session){box.innerHTML="Giriş yapmanız gerekiyor.";return}
const r=await db.from("siparisler").select("*").order("id",{ascending:false});if(r.error){box.textContent=r.error.message;return}
if(!r.data.length){box.textContent="Henüz sipariş yok.";return}
box.innerHTML=r.data.map(o=>`<div class="order"><div class="top"><div><b>${esc(o.siparis_no)}</b><div class="muted">${new Date(o.created_at).toLocaleString("tr-TR")}</div></div><span class="badge">${esc(o.durum)}</span></div><div style="margin-top:10px"><b>${esc(o.musteri_adi)}</b> • ${esc(o.musteri_telefon)}<br>${esc(o.teslimat_adresi)}<br><b>${Number(o.toplam).toLocaleString("tr-TR",{minimumFractionDigits:2})} ₺</b></div><div id="items-${o.id}" class="items">Ürünler yükleniyor...</div><div class="actions"><button class="ok" onclick="status(${o.id},'Hazırlanıyor')">Hazırlanıyor</button><button class="warn" onclick="status(${o.id},'Kargoda')">Kargoda</button><button class="ok" onclick="status(${o.id},'Tamamlandı')">Tamamlandı</button><button class="cancel" onclick="status(${o.id},'İptal')">İptal</button></div></div>`).join("");
for(const o of r.data){const x=await db.from("siparis_urunleri").select("urun_adi,adet,fiyat,ara_toplam").eq("siparis_id",o.id);const el=document.getElementById("items-"+o.id);el.innerHTML=(x.data||[]).map(i=>`${esc(i.urun_adi)} × ${i.adet} — ${Number(i.ara_toplam).toLocaleString("tr-TR",{minimumFractionDigits:2})} ₺`).join("<br>")}
}
async function status(id,durum){const r=await db.from("siparisler").update({durum}).eq("id",id);if(r.error)alert(r.error.message);else load()}load();
</script></body></html>
